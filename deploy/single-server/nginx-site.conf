# Host nginx site for the platform behind Cloudflare. Install as
# /etc/nginx/sites-available/aethercode (see README "Public address").
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aethercode.stjosephsplacements.in;

    # Cloudflare origin certificate for *.stjosephsplacements.in.
    ssl_certificate /etc/ssl/certs/stjosephs.crt;
    ssl_certificate_key /etc/ssl/private/stjosephs.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare reaches this host through the local cloudflared tunnel, so
    # requests arrive from loopback; trust its CF-Connecting-IP there only.
    # $remote_addr below is then the student's own address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Cloudflare reports the visitor's scheme; plain HTTP goes to HTTPS.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The gateway accepts JSON bodies up to 1 MiB.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The only forwarding header the gateway trusts, and only from the
        # Docker bridge address (GATEWAY_TRUSTED_PROXY_CIDRS). The rest are
        # cleared because the gateway rejects them as spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
    }
}
