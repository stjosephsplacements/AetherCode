# Single-server AetherCode platform (ADR-0017, parity plan Phase 0).
# Usage: ./setup.sh once, then `docker compose up -d --build`.
name: aethercode-platform

x-common-env: &common-env
  AETHERCODE_ENV: production
  HTTP_ADDR: 0.0.0.0:8080
  LOG_LEVEL: info
  NATS_URL: nats://nats:4222

x-authz-client: &authz-client
  AUTHZ_ENDPOINT: user:9443
  AUTHZ_CLIENT_TLS_CA_FILE: /certs/ca.crt
  AUTHZ_CLIENT_TLS_SERVER_NAME: user

x-service: &service
  restart: always
  volumes:
    - ./certs:/certs:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    buckets:
      condition: service_completed_successfully
    nats:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.4
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run setup.sh first}
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "max_connections=400"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../database/platform/dev-init.sh:/docker-entrypoint-initdb.d/00-aethercode-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.14.3-alpine
    restart: always
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing images; this is Chainguard's maintained build,
    # pinned by digest. It has bash but no curl/wget/mc, hence the health check.
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run setup.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run setup.sh first}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../..
      dockerfile: deploy/single-server/Dockerfile.tools
    image: aethercode/tools:local
    env_file: .env
    environment:
      PGHOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  judge-db:
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_DB: aether_judge_wrapper
      POSTGRES_USER: aether_judge_admin
      POSTGRES_PASSWORD: ${JUDGE_DB_PASSWORD:?run setup.sh first}
      JUDGE_DB_PASSWORD: ${JUDGE_DB_PASSWORD}
    volumes:
      - judge-db-data:/var/lib/postgresql
      - ../database/judge-control/init/001-local-roles.sql:/docker-entrypoint-initdb.d/judge-roles.sql.in:ro
      - ./judge-db-init.sh:/docker-entrypoint-initdb.d/00-judge-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_judge_admin -d aether_judge_wrapper"]
      interval: 5s
      timeout: 3s
      retries: 30

  judge-rabbitmq:
    image: rabbitmq:4.3.3-management@sha256:d8b3d416236ae5ba3f6a9f4e4651fdacda01780181a7d83a71b640248d8f0a69
    restart: always
    hostname: judge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: judge
      RABBITMQ_DEFAULT_PASS: ${JUDGE_RABBITMQ_PASSWORD:?run setup.sh first}
      RABBITMQ_DEFAULT_VHOST: judge
    volumes:
      - judge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  judge-migrate:
    image: aethercode/tools:local
    entrypoint: ["migrate", "--source", "file:///migrations/judge", "--direction", "up",
      "--database-url", "postgres://aether_judge_migrator:${JUDGE_DB_PASSWORD}@judge-db:5432/aether_judge_wrapper?sslmode=disable"]
    depends_on:
      judge-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Enables the exam languages in Judge for JUDGE_ENGINE (judge-languages.sh).
  judge-languages:
    image: postgres:18.4
    entrypoint: ["/bin/bash", "/judge-languages.sh"]
    environment:
      PGPASSWORD: ${JUDGE_DB_PASSWORD}
      JUDGE_ENGINE: ${JUDGE_ENGINE:-aethercode}
      JUDGE_WORKER_CONCURRENCY: "32"
    volumes:
      - ./judge-languages.sh:/judge-languages.sh:ro
    depends_on:
      judge-migrate:
        condition: service_completed_successfully

  buckets:
    image: cgr.dev/chainguard/minio-client@sha256:231c5976b6145971a5440dcd99257b23840513999f87cbcb68cd6a8ba674ca51
    # The image has no shell: MC_HOST_local configures the alias inline.
    command: ["mb", "--ignore-existing", "local/aethercode"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio:
        condition: service_healthy

  # Whole-cluster dumps every 15 minutes (see backup.sh and README "Backups").
  backup:
    image: postgres:18.4
    restart: always
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PLATFORM_DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      JUDGE_DB_PASSWORD: ${JUDGE_DB_PASSWORD}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      judge-db:
        condition: service_healthy

  # Continuous copy of every stored object (encrypted bundles and code). It
  # never deletes, so an object removed in MinIO stays in the backup. Root
  # only so it can write the host directory.
  backup-objects:
    image: cgr.dev/chainguard/minio-client@sha256:231c5976b6145971a5440dcd99257b23840513999f87cbcb68cd6a8ba674ca51
    restart: always
    user: "0:0"
    command: ["mirror", "--watch", "--overwrite", "local/aethercode", "/backups/objects"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    volumes:
      - ./backups:/backups
    depends_on:
      buckets:
        condition: service_completed_successfully

  identity:
    <<: *service
    environment:
      <<: *common-env
      SERVICE_NAME: identity
      IDENTITY_DATABASE_URL: postgres://aether_identity_app:${IDENTITY_DB_PASSWORD}@postgres:5432/aether_identity?sslmode=disable
      IDENTITY_PROJECTION_DATABASE_URL: postgres://aether_identity_projection_worker:${IDENTITY_DB_PASSWORD}@postgres:5432/aether_identity?sslmode=disable
      IDENTITY_ACCESS_TOKEN_ISSUER: aethercode-identity
      IDENTITY_ACCESS_TOKEN_AUDIENCE: aethercode
      IDENTITY_ACCESS_TOKEN_KEY_ID: ${IDENTITY_ACCESS_TOKEN_KEY_ID}
      IDENTITY_ACCESS_TOKEN_PRIVATE_KEY_BASE64: ${IDENTITY_ACCESS_TOKEN_PRIVATE_KEY_BASE64}
      IDENTITY_DELIVERY_TOKEN_HMAC_KEY_BASE64: ${IDENTITY_DELIVERY_TOKEN_HMAC_KEY_BASE64}
      IDENTITY_MFA_KEY_REFERENCE: ${IDENTITY_MFA_KEY_REFERENCE}
      IDENTITY_MFA_MASTER_KEYS_JSON: ${IDENTITY_MFA_MASTER_KEYS_JSON}
      IDENTITY_INTROSPECTION_ADDR: 0.0.0.0:9444
      IDENTITY_INTROSPECTION_TLS_CERT_FILE: /certs/identity.crt
      IDENTITY_INTROSPECTION_TLS_KEY_FILE: /certs/identity.key
      IDENTITY_INTROSPECTION_CLIENT_CA_FILE: /certs/ca.crt
      IDENTITY_INTROSPECTION_TRUSTED_CLIENT_SPIFFE_ID: spiffe://aethercode.local/user
      # Single sign-on (ADR-0042); off while IDENTITY_SSO_ISSUER is empty. The
      # admin token lives in ./certs (mounted at /certs), never in .env.
      IDENTITY_SSO_ISSUER: ${IDENTITY_SSO_ISSUER:-}
      IDENTITY_SSO_CLIENT_ID: ${IDENTITY_SSO_CLIENT_ID:-}
      IDENTITY_SSO_CLIENT_SECRET: ${IDENTITY_SSO_CLIENT_SECRET:-}
      IDENTITY_SSO_REDIRECT_URI: ${PUBLIC_ORIGIN}/auth/sso/callback
      IDENTITY_SSO_ADMIN_TOKEN_FILE: ${IDENTITY_SSO_ADMIN_TOKEN_FILE:-}
      IDENTITY_SSO_ORGANIZATION_ID: ${IDENTITY_SSO_ORGANIZATION_ID:-}
      IDENTITY_SSO_EMAIL_DOMAIN: ${IDENTITY_SSO_EMAIL_DOMAIN:-}
    build: { context: ../../backend, dockerfile: services/identity/Dockerfile }

  user:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: user
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/user.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/user.key
      USER_DATABASE_URL: postgres://aether_user_app:${USERS_DB_PASSWORD}@postgres:5432/aether_users?sslmode=disable
      USER_AUTHZ_DATABASE_URL: postgres://aether_user_authz_reader:${USERS_DB_PASSWORD}@postgres:5432/aether_users?sslmode=disable
      USER_PROJECTION_DATABASE_URL: postgres://aether_user_projection_worker:${USERS_DB_PASSWORD}@postgres:5432/aether_users?sslmode=disable
      AUTHZ_GRPC_ADDR: 0.0.0.0:9443
      AUTHZ_TLS_CERT_FILE: /certs/user.crt
      AUTHZ_TLS_KEY_FILE: /certs/user.key
      AUTHZ_CLIENT_CA_FILE: /certs/ca.crt
      AUTHZ_MTLS_SERVICE_TARGETS: '{"spiffe://aethercode.local/tenant":"tenant","spiffe://aethercode.local/user":"user","spiffe://aethercode.local/question-bank":"question-bank","spiffe://aethercode.local/assessment":"assessment","spiffe://aethercode.local/submission":"submission","spiffe://aethercode.local/seb":"seb","spiffe://aethercode.local/notification":"notification","spiffe://aethercode.local/analytics":"analytics"}'
      AUTHZ_IDENTITY_ASSERTION_ISSUER: aethercode-identity
      AUTHZ_IDENTITY_ASSERTION_AUDIENCE: aethercode
      AUTHZ_IDENTITY_ASSERTION_PUBLIC_KEYS: ${IDENTITY_ASSERTION_PUBLIC_KEYS}
      AUTHZ_IDENTITY_INTROSPECTION_URL: https://identity:9444/v1/internal/access-token/validate
      AUTHZ_IDENTITY_INTROSPECTION_TLS_CERT_FILE: /certs/user.crt
      AUTHZ_IDENTITY_INTROSPECTION_TLS_KEY_FILE: /certs/user.key
      AUTHZ_IDENTITY_INTROSPECTION_TLS_CA_FILE: /certs/ca.crt
      AUTHZ_IDENTITY_INTROSPECTION_TLS_SERVER_NAME: identity
      AUTHZ_CAPABILITY_KEYS: ${AUTHZ_CAPABILITY_KEYS}
    build: { context: ../../backend, dockerfile: services/user/Dockerfile }

  tenant:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: tenant
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/tenant.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/tenant.key
      TENANT_DATABASE_URL: postgres://aether_tenant_app:${TENANT_DB_PASSWORD}@postgres:5432/aether_tenant?sslmode=disable
      TENANT_PROJECTION_DATABASE_URL: postgres://aether_tenant_projection_worker:${TENANT_DB_PASSWORD}@postgres:5432/aether_tenant?sslmode=disable
    build: { context: ../../backend, dockerfile: services/tenant/Dockerfile }

  question-bank:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: question-bank
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/question-bank.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/question-bank.key
      QBANK_DATABASE_URL: postgres://aether_question_bank_app:${QBANK_DB_PASSWORD}@postgres:5432/aether_qbank?sslmode=disable
      QBANK_PROJECTION_DATABASE_URL: postgres://aether_question_bank_projection_worker:${QBANK_DB_PASSWORD}@postgres:5432/aether_qbank?sslmode=disable
      QBANK_REQUIRE_REVIEW: ${QBANK_REQUIRE_REVIEW:-false}
      QBANK_STORAGE_ENDPOINT: minio:9000
      QBANK_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      QBANK_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      QBANK_STORAGE_BUCKET: aethercode
      QBANK_STORAGE_USE_SSL: "false"
      QBANK_KMS_LOCAL_KEY: ${PLATFORM_KMS_LOCAL_KEY}
      # Internal contract for Assessment (QuestionBankInternalService), mTLS only.
      QBANK_GRPC_ADDR: 0.0.0.0:9445
      QBANK_GRPC_TLS_CERT_FILE: /certs/question-bank.crt
      QBANK_GRPC_TLS_KEY_FILE: /certs/question-bank.key
      QBANK_GRPC_CLIENT_CA_FILE: /certs/ca.crt
      # Model-solution checks: Question Bank is a Judge client with its own
      # certificate, and Judge returns it only its own jobs (ADR-0033).
      QBANK_JUDGE_GRPC_ADDR: judge:8443
      QBANK_JUDGE_TLS_SERVER_NAME: judge
      QBANK_GRPC_ALLOWED_CLIENT_SUBJECTS: assessment
    build: { context: ../../backend, dockerfile: services/question-bank/Dockerfile }

  assessment:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: assessment
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/assessment.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/assessment.key
      ASSESSMENT_DATABASE_URL: postgres://aether_assessment_app:${ASSESSMENT_DB_PASSWORD}@postgres:5432/aether_assessment?sslmode=disable
      ASSESSMENT_PROJECTION_DATABASE_URL: postgres://aether_assessment_projection_worker:${ASSESSMENT_DB_PASSWORD}@postgres:5432/aether_assessment?sslmode=disable
      ASSESSMENT_QBANK_GRPC_ADDR: question-bank:9445
      ASSESSMENT_QBANK_TLS_CERT_FILE: /certs/assessment.crt
      ASSESSMENT_QBANK_TLS_KEY_FILE: /certs/assessment.key
      ASSESSMENT_QBANK_TLS_CA_FILE: /certs/ca.crt
      ASSESSMENT_QBANK_TLS_SERVER_NAME: question-bank
    build: { context: ../../backend, dockerfile: services/assessment/Dockerfile }

  submission:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: submission
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/submission.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/submission.key
      SUBMISSION_DATABASE_URL: postgres://aether_submission_app:${SUBMISSION_DB_PASSWORD}@postgres:5432/aether_submission?sslmode=disable
      SUBMISSION_PROJECTION_DATABASE_URL: postgres://aether_submission_projection_worker:${SUBMISSION_DB_PASSWORD}@postgres:5432/aether_submission?sslmode=disable
      SUBMISSION_EXPIRY_ENABLED: "true"
      # Time-up submits a student's saved code; poll often so it lands soon after the 15 s grace.
      SUBMISSION_EXPIRY_POLL_INTERVAL: 10s
      SUBMISSION_EXPIRY_DATABASE_URL: postgres://aether_submission_expiry_worker:${SUBMISSION_DB_PASSWORD}@postgres:5432/aether_submission?sslmode=disable
      JUDGE_COMPLETION_ENABLED: "true"
      SUBMISSION_JUDGE_ADAPTER_DATABASE_URL: postgres://aether_submission_judge_adapter:${SUBMISSION_DB_PASSWORD}@postgres:5432/aether_submission?sslmode=disable
      JUDGE_COMPLETION_GRPC_ADDR: judge:8443
      JUDGE_COMPLETION_TLS_CERT_FILE: /certs/submission.crt
      JUDGE_COMPLETION_TLS_KEY_FILE: /certs/submission.key
      JUDGE_COMPLETION_TLS_CA_FILE: /certs/ca.crt
      JUDGE_COMPLETION_TLS_SERVER_NAME: judge
      JUDGE_COMPLETION_CONSUMER_ID: submission-single-server
      # Admits graded work to the same Judge, over the JUDGE_COMPLETION_* endpoint and certificates.
      JUDGE_DISPATCH_ENABLED: "true"
      SUBMISSION_STORAGE_ENDPOINT: minio:9000
      SUBMISSION_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      SUBMISSION_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SUBMISSION_STORAGE_BUCKET: aethercode
      SUBMISSION_STORAGE_USE_SSL: "false"
      SUBMISSION_KMS_LOCAL_KEY: ${PLATFORM_KMS_LOCAL_KEY}
    build: { context: ../../backend, dockerfile: services/submission/Dockerfile }

  seb:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: seb
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/seb.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/seb.key
      SEB_DATABASE_URL: postgres://aether_seb_app:${SEB_DB_PASSWORD}@postgres:5432/aether_seb?sslmode=disable
      SEB_PROJECTION_DATABASE_URL: postgres://aether_seb_projection_worker:${SEB_DB_PASSWORD}@postgres:5432/aether_seb?sslmode=disable
      SEB_STORAGE_ENDPOINT: minio:9000
      SEB_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      SEB_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SEB_STORAGE_BUCKET: aethercode
      SEB_STORAGE_USE_SSL: "false"
      SEB_KMS_LOCAL_KEY: ${PLATFORM_KMS_LOCAL_KEY}
      # .seb launch files open ${PUBLIC_ORIGIN}/exam/<exam_id> (ADR-0022).
      SEB_LAUNCH_BASE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is not set; see setup.sh}
      SEB_LAUNCH_PASSWORD: ${SEB_LAUNCH_PASSWORD:?SEB_LAUNCH_PASSWORD is not set; see setup.sh}
    build: { context: ../../backend, dockerfile: services/seb/Dockerfile }

  notification:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: notification
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/notification.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/notification.key
      NOTIFICATION_DATABASE_URL: postgres://aether_notification_app:${NOTIFICATION_DB_PASSWORD}@postgres:5432/aether_notification?sslmode=disable
      NOTIFICATION_PROJECTION_DATABASE_URL: postgres://aether_notification_projection_worker:${NOTIFICATION_DB_PASSWORD}@postgres:5432/aether_notification?sslmode=disable
      NOTIFICATION_RETENTION_ENABLED: "true"
      NOTIFICATION_RETENTION_DATABASE_URL: postgres://aether_notification_retention_worker:${NOTIFICATION_DB_PASSWORD}@postgres:5432/aether_notification?sslmode=disable
    build: { context: ../../backend, dockerfile: services/notification/Dockerfile }

  analytics:
    <<: *service
    environment:
      <<: [*common-env, *authz-client]
      SERVICE_NAME: analytics
      AUTHZ_CLIENT_TLS_CERT_FILE: /certs/analytics.crt
      AUTHZ_CLIENT_TLS_KEY_FILE: /certs/analytics.key
      ANALYTICS_DATABASE_URL: postgres://aether_analytics_app:${ANALYTICS_DB_PASSWORD}@postgres:5432/aether_analytics?sslmode=disable
      ANALYTICS_PROJECTION_DATABASE_URL: postgres://aether_analytics_projection_worker:${ANALYTICS_DB_PASSWORD}@postgres:5432/aether_analytics?sslmode=disable
    build: { context: ../../backend, dockerfile: services/analytics/Dockerfile }

  judge:
    <<: *service
    environment:
      <<: *common-env
      SERVICE_NAME: judge
      JUDGE_DATABASE_URL: postgres://aether_judge_app:${JUDGE_DB_PASSWORD}@judge-db:5432/aether_judge_wrapper?sslmode=disable
      JUDGE_RABBITMQ_URL: amqp://judge:${JUDGE_RABBITMQ_PASSWORD}@judge-rabbitmq:5672/judge
      JUDGE_GRPC_ADDR: 0.0.0.0:8443
      JUDGE_TLS_CERT_FILE: /certs/judge.crt
      JUDGE_TLS_KEY_FILE: /certs/judge.key
      JUDGE_CLIENT_CA_FILE: /certs/ca.crt
      JUDGE_ALLOWED_CLIENT_SUBJECTS: submission,question-bank
      # Approved for the campus server with engine-check evidence (decision D4).
      JUDGE_ENGINE_COMPATIBILITY_APPROVED: "true"
      JUDGE_STORAGE_ENDPOINT: minio:9000
      JUDGE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      JUDGE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JUDGE_STORAGE_BUCKET: aethercode
      JUDGE_STORAGE_USE_SSL: "false"
      JUDGE_KMS_LOCAL_KEY: ${PLATFORM_KMS_LOCAL_KEY}
      JUDGE_DISPATCHER_ENABLED: "true"
      JUDGE_WORKER_CONCURRENCY: "32"
      # aethercode (default) is the college's execution engine on the host;
      # judge0 needs cgroup v1 and `--profile judge0`.
      JUDGE_ENGINE: ${JUDGE_ENGINE:-aethercode}
      # The AetherCode Execution Engine runs on the host (systemd, go-judge),
      # listening on the docker0 address only (ADR-0028).
      AETHERCODE_ENGINE_URL: ${AETHERCODE_ENGINE_URL:-http://host.docker.internal:5100}
      JUDGE0_BASE_URL: http://judge0-server:2358
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?run setup.sh first}
    build: { context: ../../backend, dockerfile: services/judge/Dockerfile }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      judge-languages:
        condition: service_completed_successfully
      judge-rabbitmq:
        condition: service_healthy

  # Judge0 runs only with `--profile judge0`: its isolate sandbox needs
  # cgroup v1 on the host and ~7 GB of disk (see README).
  judge0-server:
    profiles: ["judge0"]
    image: judge0/judge0:1.13.1
    restart: always
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    profiles: ["judge0"]
    image: judge0/judge0:1.13.1
    restart: always
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    profiles: ["judge0"]
    image: postgres:16-alpine
    restart: always
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data

  judge0-redis:
    profiles: ["judge0"]
    image: redis:7-alpine
    restart: always
    command: ["sh", "-c", 'redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf

  gateway:
    <<: *service
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      GATEWAY_IDENTITY_ASSERTION_ISSUER: aethercode-identity
      GATEWAY_IDENTITY_ASSERTION_AUDIENCE: aethercode
      GATEWAY_IDENTITY_ASSERTION_PUBLIC_KEYS: ${IDENTITY_ASSERTION_PUBLIC_KEYS}
      # The frontend (ADR-0024) forwards each student's address from its fixed
      # edge address; the host nginx reaches the gateway through the Docker
      # bridge address. A .env value must list both.
      GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-["10.231.240.2/32"]}
      # Every candidate request to Submission passes the SEB lockdown check
      # (ADR-0022); SEB hashes the URL at the public origin.
      GATEWAY_SEB_PROTECTED_PREFIXES: '["/api/submission/v1/tenants"]'
      GATEWAY_SEB_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is not set; see setup.sh}
      GATEWAY_UPSTREAMS: '{"identity":"http://identity:8080","tenant":"http://tenant:8080","user":"http://user:8080","question-bank":"http://question-bank:8080","assessment":"http://assessment:8080","submission":"http://submission:8080","seb":"http://seb:8080","notification":"http://notification:8080","analytics":"http://analytics:8080"}'
    build: { context: ../../backend, dockerfile: services/gateway/Dockerfile }
    ports:
      # Loopback only: the public address is the host nginx (nginx-site.conf).
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks:
      default:
      # Fixed too, or the gateway, started first, could take the frontend's.
      edge:
        ipv4_address: 10.231.240.3

  # The web UI (ADR-0024). The host nginx sends every request here; /api is
  # proxied to the gateway over the edge network with the session's bearer.
  frontend:
    restart: always
    build: { context: ../../frontend }
    environment:
      GATEWAY_URL: http://gateway:8080
      # "on" shows "Sign in with your St. Joseph's account" (ADR-0042).
      AETHERCODE_SSO: ${AETHERCODE_SSO:-off}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is not set; see setup.sh}
      # College names, colours and logos (ADR-0045); absent file, default look.
      BRANDING_FILE: /branding/branding.json
    volumes:
      - ./branding:/branding:ro
    depends_on: [gateway]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      edge:
        ipv4_address: 10.231.240.2

# Only the frontend and the gateway share this network, so the frontend's
# fixed address is the one the gateway trusts for X-Forwarded-For. The subnet
# sits outside Docker's default pools (172.17-31.x, 192.168.x), which a busy
# host can use up entirely.
networks:
  edge:
    ipam:
      config:
        - subnet: 10.231.240.0/29

volumes:
  judge0-db-data:
  judge-db-data:
  judge-rabbitmq-data:
  postgres-data:
  nats-data:
  minio-data:
