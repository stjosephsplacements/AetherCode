# Objects Traefik needs beyond the Helm chart. Apply after the chart is installed.
# Only Cloudflare and the cluster/LAN may reach the entry points (same list as ingress-nginx's allow-cidrs).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: cloudflare-only, namespace: traefik}
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 127.0.0.1/32
      - 10.42.0.0/16
      - 10.43.0.0/16
      - 10.1.55.0/24
      - 10.1.53.0/24
---
# cdn.stjosephsplacements.in: the old ingress used rewrite-target and snippets, which Traefik skips.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: cdn-rewrite, namespace: minio}
spec:
  replacePathRegex: {regex: "^/(.*)", replacement: "/cdn/$1"}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: cdn-headers, namespace: minio}
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Content-Type-Options: nosniff
      Access-Control-Allow-Origin: "*"
      Access-Control-Allow-Methods: "GET, HEAD, OPTIONS"
      Vary: Accept-Encoding
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn-traefik
  namespace: minio
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: minio-cdn-rewrite@kubernetescrd,minio-cdn-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cdn.stjosephsplacements.in
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: minio-api, port: {number: 9000}}}}
---
# www.algoqx.tech redirects to the apex (was a server-snippet).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: www-to-apex, namespace: algoqx}
spec:
  redirectRegex: {regex: "^https?://www\\.algoqx\\.tech(.*)", replacement: "https://algoqx.tech${1}", permanent: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: algoqx-www-traefik
  namespace: algoqx
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: algoqx-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.algoqx.tech
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: algoqx-web, port: {name: http}}}}
---
# The nginx provider reads Ingresses by class name, which needs this IngressClass to exist.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx
