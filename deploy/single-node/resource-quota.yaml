# Caps AetherCode at about 40% of the 256-core campus server. Requests are what the
# scheduler enforces; limits may burst above them. Apply once per namespace:
#   kubectl -n aethercode-prod apply -f deploy/single-node/resource-quota.yaml
# See docs/runbooks/capacity-budget.md for how the numbers add up.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aethercode-budget
spec:
  hard:
    requests.cpu: "102"
    requests.memory: 120Gi
