# CloudNativePG cluster for the single campus server (k3s, one node). The production
# chart in deploy/helm/platform-postgres-ha assumes three hosts and cannot schedule here.
#
# The pods run under the AppArmor profile `aethercode-postgres` (deploy/single-node/apparmor/),
# which must be loaded on the node first: run deploy/single-node/apparmor/install.sh. Under the
# default profile PostgreSQL 18's processes lose the signals they send each other on this node,
# so the initdb job hangs ("Setting up primary" forever); the custom profile is the default
# with signals allowed and everything else still denied (ADR-0074, ADR-0082).
# io_method: sync and huge_pages: off match those clusters too.
#
# These are the production sizes (16/24 CPU, 24/32Gi, max_connections 500). Development
# runs the same manifest with 2/4 CPU, 4/8Gi, shared_buffers 2GB, max_connections 200 and
# a 20Gi volume, so it does not hold 16 cores of the shared server.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  labels:
    app.kubernetes.io/part-of: aethercode
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  inheritedMetadata:      # the service charts' egress policies select PostgreSQL by these labels
    labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: aethercode}
  podSecurityContext:
    appArmorProfile: {type: Localhost, localhostProfile: aethercode-postgres}
  backup:               # base backups and WAL archive in the shared MinIO; dev uses the path .../dev
    retentionPolicy: 14d
    barmanObjectStore:  # deprecated: removed in CloudNativePG 1.31, migrate to the Barman Cloud plugin first
      destinationPath: s3://aethercode-pg-backups/prod
      endpointURL: http://minio-api.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId: {name: cnpg-backup-s3, key: ACCESS_KEY_ID}
        secretAccessKey: {name: cnpg-backup-s3, key: ACCESS_SECRET_KEY}
      wal: {compression: gzip}
      data: {compression: gzip}
  storage:
    storageClass: local-production # Retain: deleting the Cluster never deletes the data
    size: 50Gi
  resources:
    requests: {cpu: "16", memory: 24Gi}
    limits: {cpu: "24", memory: 32Gi}
  postgresql:
    parameters:
      shared_buffers: 16GB
      effective_cache_size: 24GB
      work_mem: 32MB
      maintenance_work_mem: 1GB
      max_connections: "500"
      checkpoint_completion_target: "0.9"
      max_wal_size: 4GB
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      io_method: sync
      huge_pages: "off"
      log_min_duration_statement: "1000"
