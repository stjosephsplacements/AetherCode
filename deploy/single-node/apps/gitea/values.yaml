# Gitea 1.27.0 (chart 12.7.0): a CI and review mirror of the GitHub repository, run on the campus server.
#   helm upgrade --install gitea gitea-charts/gitea --version 12.7.0 -n gitea --create-namespace -f values.yaml
# Secrets are Kubernetes Secrets created on the server: gitea-db (password) and gitea-admin.
image: {tag: 1.27.0, rootless: true}
strategy: {type: Recreate}              # one pod owns the data directory
replicaCount: 1
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "4", memory: 4Gi}
persistence: {enabled: true, existingClaim: gitea-data}
postgresql: {enabled: false}
postgresql-ha: {enabled: false}
valkey: {enabled: false}
valkey-cluster: {enabled: false}
service:
  http: {type: ClusterIP, port: 3000}
  ssh: {type: ClusterIP}
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: git.stjosephsplacements.in
      paths: [{path: /, pathType: Prefix}]
gitea:
  admin:
    existingSecret: gitea-admin
    passwordMode: keepUpdated
  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__PASSWD
      valueFrom: {secretKeyRef: {name: gitea-db, key: password}}
  metrics:
    enabled: true
    serviceMonitor: {enabled: true, additionalLabels: {release: kube-prometheus}}
  config:
    APP_NAME: "St. Joseph's Git"
    server:
      DOMAIN: git.stjosephsplacements.in
      ROOT_URL: https://git.stjosephsplacements.in/
      DISABLE_SSH: true
      LFS_START_SERVER: true
    database:
      DB_TYPE: postgres
      HOST: postgres-cluster-rw.production.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      SSL_MODE: require
      MAX_OPEN_CONNS: 25
      MAX_IDLE_CONNS: 5
      CONN_MAX_LIFETIME: 3m
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
      DEFAULT_KEEP_EMAIL_PRIVATE: true
      DEFAULT_ALLOW_CREATE_ORGANIZATION: false
      DEFAULT_ORG_VISIBILITY: private
      DEFAULT_USER_VISIBILITY: limited
      ENABLE_NOTIFY_MAIL: false
    security:
      INSTALL_LOCK: true
      MIN_PASSWORD_LENGTH: 12
      PASSWORD_COMPLEXITY: "lower,upper,digit"
      PASSWORD_HASH_ALGO: argon2
      DISABLE_GIT_HOOKS: true            # custom git hooks run arbitrary code on the server
    session: {PROVIDER: db, COOKIE_SECURE: true, SAME_SITE: lax, SESSION_LIFE_TIME: 86400}
    admin: {DISABLE_REGULAR_ORG_CREATION: true}
    picture: {DISABLE_GRAVATAR: true, ENABLE_FEDERATED_AVATAR: false}   # no email hashes sent to third parties
    openid: {ENABLE_OPENID_SIGNIN: false, ENABLE_OPENID_SIGNUP: false}
    repository: {DEFAULT_PRIVATE: private, ENABLE_PUSH_CREATE_USER: false, ENABLE_PUSH_CREATE_ORG: false}
    other: {SHOW_FOOTER_VERSION: false, ENABLE_SITEMAP: false, ENABLE_FEED: false}
    attachment: {MAX_SIZE: 100}
    packages: {ENABLED: true, LIMIT_TOTAL_OWNER_SIZE: 20GiB}
    log: {LEVEL: Info}
    # Google sign-in (the source itself is added with `gitea admin auth add-oauth`, see README): nobody can register through
    # it, and a Google login is linked to the existing account that has the same verified email.
    oauth2_client: {ENABLE_AUTO_REGISTRATION: false, ACCOUNT_LINKING: auto, UPDATE_AVATAR: true}
    actions: {ENABLED: true, DEFAULT_ACTIONS_URL: github, ARTIFACT_RETENTION_DAYS: 14, LOG_RETENTION_DAYS: 30}
    mirror: {ENABLED: true, DEFAULT_INTERVAL: 10m, MIN_INTERVAL: 1m}
    indexer: {ISSUE_INDEXER_TYPE: bleve, REPO_INDEXER_ENABLED: true}
    metrics: {ENABLED: true}
