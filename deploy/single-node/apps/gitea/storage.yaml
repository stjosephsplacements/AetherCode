# Gitea's data (repositories, LFS, packages, indexes) lives in /data/production/gitea/data.
apiVersion: v1
kind: PersistentVolume
metadata: {name: gitea-data}
spec:
  capacity: {storage: 500Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath: {path: /data/production/gitea/data, type: Directory}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gitea-data, namespace: gitea}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: gitea-data
  resources: {requests: {storage: 500Gi}}
