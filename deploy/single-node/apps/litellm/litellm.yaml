# LiteLLM proxy and its Redis cache, moved from a systemd unit and a host Redis.
# Config lives in /data/production/litellm/config.yaml (mounted read-only). The proxy is published on
# the host's loopback only (hostIP 127.0.0.1:20128); inside the cluster it is litellm.ai-gateway:20128.
# Note: the model backends in that config (host ports 30000 and 30001) are not running, so model
# requests fail until a model server is started there. The cache is disposable: no persistence.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
  labels: {app.kubernetes.io/part-of: production-apps}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-gateway
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: production-apps}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: production-apps}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: docker.io/library/redis:8.0.5
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{name: redis, containerPort: 6379}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 20}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-gateway
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-gateway
  labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: production-apps}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: litellm}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: production-apps}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.108.0
          args: ["--config", "/app/config.yaml", "--port", "20128", "--host", "0.0.0.0", "--num_workers", "4"]
          env:
            - {name: LITELLM_TELEMETRY, value: "False"}
            - {name: HOME, value: /tmp}
          ports: [{name: http, containerPort: 20128, hostPort: 20128, hostIP: 127.0.0.1}]
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "8", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /health/liveliness, port: http}, periodSeconds: 10, failureThreshold: 18}
          livenessProbe: {httpGet: {path: /health/liveliness, port: http}, periodSeconds: 30, failureThreshold: 6}
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          hostPath: {path: /data/production/litellm, type: Directory}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-gateway
spec:
  selector: {app.kubernetes.io/name: litellm}
  ports: [{name: http, port: 20128, targetPort: http}]
---
# Redis has no password: only the proxy may connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-litellm
  namespace: ai-gateway
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}}]
      ports: [{port: 6379, protocol: TCP}]
