# Single-instance backing services, sized for a campus. They mirror the
# single-server Docker Compose stack. For high availability use managed or
# operator-run equivalents (platform-postgres-ha, a NATS cluster, an S3 service)
# and disable the matching block here; point platform-service's global.* at them.

secretName: aethercode-secrets

images:
  postgres: postgres:18.6
  nats: nats:2.14.3-alpine
  minio: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
  minioClient: cgr.dev/chainguard/minio-client@sha256:231c5976b6145971a5440dcd99257b23840513999f87cbcb68cd6a8ba674ca51
  rabbitmq: rabbitmq:4.3.3-management@sha256:d8b3d416236ae5ba3f6a9f4e4651fdacda01780181a7d83a71b640248d8f0a69

storageClass: ""

# Deny all ingress in the namespace; every workload's chart then opens exactly
# what it needs. Needs a CNI that enforces NetworkPolicy.
defaultDeny:
  enabled: true

postgres:
  enabled: true
  # PostgreSQL io_method (worker, io_uring, sync). Leave empty for the server default; set
  # "sync" on kernels where asynchronous I/O hangs (see values-infra-kernel-workaround.yaml).
  ioMethod: ""
  # posix_fallocate (the server default) or write_zeros. Some kernels and filesystems stall inside
  # posix_fallocate while a relation is extended; see values-infra-kernel-workaround.yaml.
  fileExtendMethod: ""
  # Run the container without the node's default AppArmor profile. On some kernels that profile denies
  # signals between processes of the same container; PostgreSQL wakes its backends with signals, so
  # reloads (pg_reload_conf), pg_terminate_backend and lock wake-ups fail or hang.
  appArmorUnconfined: false
  livenessInitialDelaySeconds: 30
  storage: 100Gi
  maxConnections: 400
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}

judgeDb:
  enabled: true
  ioMethod: ""
  fileExtendMethod: ""
  appArmorUnconfined: false
  livenessInitialDelaySeconds: 30
  storage: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

nats:
  enabled: true
  replicas: 3
  storage: 10Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

minio:
  enabled: true
  storage: 100Gi
  bucket: aethercode
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

rabbitmq:
  enabled: true
  storage: 10Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

# Whole-cluster dumps of both databases every fifteen minutes (backup.sh), kept
# on a volume. Copy that volume off the cluster; a backup in the same failure
# domain is not a backup.
backup:
  enabled: true
  schedule: "*/15 * * * *"
  retentionDays: 7
  storage: 50Gi

# Set when the execution engine and go-judge run in this namespace (a single-node install).
engineInNamespace:
  enabled: false
