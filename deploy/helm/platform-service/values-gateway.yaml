nameOverride: "gateway"

image:
  repository: ghcr.io/Shreesh-Sree/CoderQX/gateway
  tag: ""

service:
  type: LoadBalancer
  port: 8080

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

envFrom:
  - secretRef:
      name: gateway-secrets
