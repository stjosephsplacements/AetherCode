{{- if .Values.networkPolicy.enabled }}
{{- /* Ingress only: from the named platform services, from anything in the listed namespaces, and from the monitoring scraper on the HTTP port. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-service.fullname" . }}
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aethercode
              app.kubernetes.io/name: {{ .service | quote }}
      {{- if .ports }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.allowFromNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
{{- end }}
