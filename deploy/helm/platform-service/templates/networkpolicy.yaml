{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-service.fullname" . }}
  labels:
    {{- include "platform-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aethercode
              app.kubernetes.io/name: {{ .service | quote }}
      {{- if .ports }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.allowFromNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- /* DNS */ -}}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dnsNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dnsPodLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- /* Postgres */ -}}
    {{- if .Values.networkPolicy.egress.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aethercode
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.postgres.port }}
    {{- end }}
    {{- /* NATS */ -}}
    {{- if .Values.networkPolicy.egress.nats.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aethercode
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.nats.port }}
    {{- end }}
    {{- /* User service gRPC (authorization) */ -}}
    {{- if .Values.networkPolicy.egress.userGrpc.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aethercode
              app.kubernetes.io/name: user
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.userGrpc.port }}
    {{- end }}
    {{- /* Per-service extra egress rules */ -}}
    {{- range .Values.networkPolicy.egress.extraRules }}
    - to:
        {{- toYaml .to | nindent 8 }}
      {{- if .ports }}
      ports:
        {{- toYaml .ports | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
