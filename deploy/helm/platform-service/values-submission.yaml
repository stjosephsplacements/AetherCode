# submission: environment mirrors deploy/single-server/docker-compose.yml.
nameOverride: submission

image:
  repository: ghcr.io/stjosephsplacements/aethercode-submission
  tag: ""

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 768Mi

tls:
  enabled: true
  secretName: aethercode-tls-submission

config:
  SERVICE_NAME: "submission"
  AUTHZ_ENDPOINT: "user:9443"
  AUTHZ_CLIENT_TLS_CA_FILE: "/certs/ca.crt"
  AUTHZ_CLIENT_TLS_SERVER_NAME: "user"
  AUTHZ_CLIENT_TLS_CERT_FILE: "/certs/tls.crt"
  AUTHZ_CLIENT_TLS_KEY_FILE: "/certs/tls.key"
  SUBMISSION_EXPIRY_ENABLED: "true"
  SUBMISSION_EXPIRY_POLL_INTERVAL: "10s"
  JUDGE_COMPLETION_ENABLED: "true"
  JUDGE_COMPLETION_GRPC_ADDR: "judge:8443"
  JUDGE_COMPLETION_TLS_CERT_FILE: "/certs/tls.crt"
  JUDGE_COMPLETION_TLS_KEY_FILE: "/certs/tls.key"
  JUDGE_COMPLETION_TLS_CA_FILE: "/certs/ca.crt"
  JUDGE_COMPLETION_TLS_SERVER_NAME: "judge"
  JUDGE_COMPLETION_CONSUMER_ID: "submission-{{ .Release.Namespace }}"
  JUDGE_DISPATCH_ENABLED: "true"

secretEnv:
  - name: SUBMISSION_DB_PASSWORD
  - name: MINIO_ROOT_USER
  - name: MINIO_ROOT_PASSWORD
  - name: PLATFORM_KMS_LOCAL_KEY

env:
  - name: SUBMISSION_DATABASE_URL
    value: "postgres://aether_submission_app:$(SUBMISSION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_submission?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: SUBMISSION_PROJECTION_DATABASE_URL
    value: "postgres://aether_submission_projection_worker:$(SUBMISSION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_submission?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: SUBMISSION_EXPIRY_DATABASE_URL
    value: "postgres://aether_submission_expiry_worker:$(SUBMISSION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_submission?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: SUBMISSION_JUDGE_ADAPTER_DATABASE_URL
    value: "postgres://aether_submission_judge_adapter:$(SUBMISSION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_submission?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: SUBMISSION_STORAGE_ENDPOINT
    value: "{{ .Values.global.minioEndpoint }}"
  - name: SUBMISSION_STORAGE_ACCESS_KEY
    value: "$(MINIO_ROOT_USER)"
  - name: SUBMISSION_STORAGE_SECRET_KEY
    value: "$(MINIO_ROOT_PASSWORD)"
  - name: SUBMISSION_STORAGE_BUCKET
    value: "aethercode"
  - name: SUBMISSION_STORAGE_USE_SSL
    value: "{{ .Values.global.minioUseSSL }}"
  - name: SUBMISSION_KMS_LOCAL_KEY
    value: "$(PLATFORM_KMS_LOCAL_KEY)"

networkPolicy:
  allowFrom:
    - service: gateway
      ports: [8080]
