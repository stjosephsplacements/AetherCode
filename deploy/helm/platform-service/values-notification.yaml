# notification: environment mirrors deploy/single-server/docker-compose.yml.
nameOverride: notification

image:
  repository: ghcr.io/stjosephsplacements/aethercode-notification
  tag: ""

replicaCount: 2

tls:
  enabled: true
  secretName: aethercode-tls-notification

config:
  SERVICE_NAME: "notification"
  AUTHZ_ENDPOINT: "user:9443"
  AUTHZ_CLIENT_TLS_CA_FILE: "/certs/ca.crt"
  AUTHZ_CLIENT_TLS_SERVER_NAME: "user"
  AUTHZ_CLIENT_TLS_CERT_FILE: "/certs/tls.crt"
  AUTHZ_CLIENT_TLS_KEY_FILE: "/certs/tls.key"
  NOTIFICATION_RETENTION_ENABLED: "true"

secretEnv:
  - name: NOTIFICATION_DB_PASSWORD

env:
  - name: NOTIFICATION_DATABASE_URL
    value: "postgres://aether_notification_app:$(NOTIFICATION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_notification?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: NOTIFICATION_PROJECTION_DATABASE_URL
    value: "postgres://aether_notification_projection_worker:$(NOTIFICATION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_notification?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: NOTIFICATION_RETENTION_DATABASE_URL
    value: "postgres://aether_notification_retention_worker:$(NOTIFICATION_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_notification?sslmode={{ .Values.global.postgresSSLMode }}"

networkPolicy:
  allowFrom:
    - service: gateway
      ports: [8080]
