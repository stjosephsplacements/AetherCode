# assessment: environment mirrors deploy/single-server/docker-compose.yml.
nameOverride: assessment

image:
  repository: ghcr.io/stjosephsplacements/aethercode-assessment
  tag: ""

replicaCount: 2

tls:
  enabled: true
  secretName: aethercode-tls-assessment

config:
  SERVICE_NAME: "assessment"
  AUTHZ_ENDPOINT: "user:9443"
  AUTHZ_CLIENT_TLS_CA_FILE: "/certs/ca.crt"
  AUTHZ_CLIENT_TLS_SERVER_NAME: "user"
  AUTHZ_CLIENT_TLS_CERT_FILE: "/certs/tls.crt"
  AUTHZ_CLIENT_TLS_KEY_FILE: "/certs/tls.key"
  ASSESSMENT_QBANK_GRPC_ADDR: "question-bank:9445"
  ASSESSMENT_QBANK_TLS_CERT_FILE: "/certs/tls.crt"
  ASSESSMENT_QBANK_TLS_KEY_FILE: "/certs/tls.key"
  ASSESSMENT_QBANK_TLS_CA_FILE: "/certs/ca.crt"
  ASSESSMENT_QBANK_TLS_SERVER_NAME: "question-bank"

secretEnv:
  - name: ASSESSMENT_DB_PASSWORD

env:
  - name: ASSESSMENT_DATABASE_URL
    value: "postgres://aether_assessment_app:$(ASSESSMENT_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_assessment?sslmode={{ .Values.global.postgresSSLMode }}"
  - name: ASSESSMENT_PROJECTION_DATABASE_URL
    value: "postgres://aether_assessment_projection_worker:$(ASSESSMENT_DB_PASSWORD)@{{ .Values.global.postgresHost }}:5432/aether_assessment?sslmode={{ .Values.global.postgresSSLMode }}"

networkPolicy:
  allowFrom:
    - service: gateway
      ports: [8080]
