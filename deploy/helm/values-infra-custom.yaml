# We use existing CNPG cluster for postgres and judgeDb
postgres:
  enabled: false

judgeDb:
  enabled: false

backup:
  enabled: false

# NATS JetStream, MinIO, RabbitMQ remain enabled
nats:
  enabled: true
  replicas: 1
  storage: 5Gi

minio:
  enabled: true
  storage: 20Gi

rabbitmq:
  enabled: true
  storage: 5Gi

defaultDeny:
  enabled: false
