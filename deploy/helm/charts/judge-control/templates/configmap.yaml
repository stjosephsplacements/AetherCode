{{- include "judge-control.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "judge-control.fullname" . }}-config
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
data:
  AETHERCODE_ENV: production
  JUDGE_TLS_CERT_FILE: /var/run/aethercode/tls/tls.crt
  JUDGE_TLS_KEY_FILE: /var/run/aethercode/tls/tls.key
  JUDGE_CLIENT_CA_FILE: /var/run/aethercode/tls/ca.crt
  JUDGE_ALLOWED_CLIENT_SUBJECTS: {{ join "," .Values.tls.allowedClientSubjects | quote }}
  # Names must match services/judge/internal/{config,dispatcher}/runtime.go.
  JUDGE_DISPATCHER_ENABLED: {{ ternary "true" "false" .Values.engine.enabled | quote }}
  JUDGE_ENGINE_COMPATIBILITY_APPROVED: {{ ternary "true" "false" .Values.engine.compatibilityApproved | quote }}
  {{- if .Values.engine.enabled }}
  JUDGE_ENGINE: judge0
  JUDGE0_BASE_URL: {{ .Values.engine.endpoint | quote }}
  {{- end }}
