{{- include "judge-control.validate" . }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "judge-control.fullname" . }}
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "judge-control.selectorLabels" . | nindent 6 }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "judge-control.fullname" . }}
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "judge-control.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.averageCPUUtilization }}
{{- end }}
