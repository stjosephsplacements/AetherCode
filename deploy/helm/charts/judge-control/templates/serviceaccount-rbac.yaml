{{- include "judge-control.validate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "judge-control.fullname" . }}
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "judge-control.fullname" . }}-rabbitmq
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "judge-control.fullname" . }}-rabbitmq-peer-discovery
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "judge-control.fullname" . }}-rabbitmq-peer-discovery
  labels:
    {{- include "judge-control.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "judge-control.fullname" . }}-rabbitmq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "judge-control.fullname" . }}-rabbitmq-peer-discovery
{{- end }}
