name: ci

on:
  pull_request:
    branches: [production, development]
  push:
    branches: [production, development]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      # Docker builds each service on its own, without go.work: a module whose
      # go.mod or go.sum drifted builds in the workspace and breaks the image.
      - name: Modules are tidy and build standalone
        run: |
          set -euo pipefail
          for dir in backend/libs/pkg backend/libs/proto backend/services/*/; do
            (cd "$dir" && GOWORK=off go mod tidy && GOWORK=off go build ./...)
          done
          git diff --exit-code -- '*.mod' '*.sum'
      - run: (cd backend && go work sync)
      - run: make build
      - run: make test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install -g pnpm@12.6.0
      - run: make web-check
      - run: make web-build

  exam-v1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install -g pnpm@12.6.0
      - run: make exam-check
      - run: make exam-build

  integration-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: (cd backend && go work sync)
      - run: make test-integration

  migration-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: make test-migrations
      - name: Validate Soft Delete Implementation
        run: ./backend/scripts/validate-soft-delete.sh

  lint-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: (cd backend/libs/proto && buf lint)

  vulnerability-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: make vuln

  build-images:
    needs: [build-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - tenant
          - user
          - question-bank
          - assessment
          - submission
          - judge
          - seb
          - notification
          - analytics
        include:
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
          - service: proctor
            context: backend/services/proctor
            file: backend/services/proctor/Dockerfile
          - service: tools
            context: .
            file: deploy/single-server/Dockerfile.tools

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || 'backend' }}
          file: ${{ matrix.file || format('backend/services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/production' && format('ghcr.io/{0}/aethercode-{1}:latest', github.repository_owner, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install cosign
        if: github.ref == 'refs/heads/production'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/production'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: github.ref == 'refs/heads/production'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}

      - name: Attach SBOM to image
        if: github.ref == 'refs/heads/production'
        run: |
          cosign attach sbom \
            --sbom sbom-${{ matrix.service }}.spdx.json \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  helm-lint:
    needs: [build-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint and render all charts
        run: deploy/helm/lint.sh

  deploy:
    needs:
      - build-test
      - web
      - exam-v1
      - integration-test
      - migration-verification
      - lint-contracts
      - vulnerability-scan
      - build-images
      - helm-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_CONTENT"
          mkdir -p "$HOME/.kube"
          chmod 700 "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Run migrations and deploy production images
        env:
          IMAGE_TAG: ${{ github.sha }}
          NAMESPACE: ${{ secrets.PROD_K8S_NAMESPACE }}
          SERVICES: ${{ secrets.PROD_SERVICES }}
        run: |
          set -euo pipefail
          chart=deploy/helm/platform-service
          read -ra services <<< "$SERVICES"

          migration_values=$(helm get values migrations --namespace "$NAMESPACE" -o json)
          postgres_host=$(jq -er '.global.postgresHost // .postgresHost | select(type == "string" and length > 0)' <<<"$migration_values")
          judge_db_host=$(jq -er '.global.judgeDbHost // .judgeDbHost | select(type == "string" and length > 0)' <<<"$migration_values")
          helm upgrade migrations deploy/helm/platform-migrations \
            --namespace "$NAMESPACE" \
            --reset-then-reuse-values \
            --set-string global.postgresHost="$postgres_host" \
            --set-string global.judgeDbHost="$judge_db_host" \
            --set image.tag="$IMAGE_TAG" \
            --wait --atomic --timeout 15m

          for service in "${services[@]}"; do
            helm upgrade "$service" "$chart" \
              --namespace "$NAMESPACE" \
              --reuse-values \
              --values "deploy/helm/platform-service/values-$service.yaml" \
              --set image.tag="$IMAGE_TAG" \
              --set "imagePullSecrets[0].name=ghcr-creds" \
              --wait --atomic --timeout 10m
          done

      - name: Show production workload status
        if: always()
        env:
          NAMESPACE: ${{ secrets.PROD_K8S_NAMESPACE }}
        run: kubectl get deployments,pods -n "$NAMESPACE"

  deploy-dev:
    needs:
      - build-test
      - web
      - build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to development server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          SHA: ${{ github.sha }}
          # GITHUB_TOKEN is a built-in CI secret with read:packages on GHCR.
          # Passed to the server as GHCR_TOKEN via SSH so ctr pull authenticates
          # without storing any credential on the server itself.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/id_deploy" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "GHCR_TOKEN='${GHCR_TOKEN}' bash '${DEPLOY_PATH}/deploy/dev/dev-sync.sh' '${SHA}' gateway identity tenant user question-bank assessment submission judge seb notification analytics frontend"
