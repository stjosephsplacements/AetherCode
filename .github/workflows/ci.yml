name: ci

on:
  pull_request:
    branches: [production, development]
  push:
    branches: [production, development]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Dependabot PRs still report the required check names (build-test, web) as
  # green no-ops so rulesets + dependabot-auto-merge can finish without a full CI run.
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Dependabot gate
        id: gate
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      # Docker builds each service on its own, without go.work: a module whose
      # go.mod or go.sum drifted builds in the workspace and breaks the image.
      - name: Modules are tidy and build standalone
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for dir in backend/libs/pkg backend/libs/proto backend/services/*/; do
            # Skip non-Go service directories (e.g. proctor which is Python)
            [[ -f "${dir%/}/go.mod" ]] || continue
            (cd "$dir" && GOWORK=off go mod tidy && GOWORK=off go build ./...)
          done
          git diff --exit-code -- '*.mod' '*.sum'
      - name: Generated authz migrations match their template
        if: steps.gate.outputs.skip != 'true'
        run: python3 backend/scripts/generate_authz_migration.py --verify
      - if: steps.gate.outputs.skip != 'true'
        run: (cd backend && go work sync)
      - if: steps.gate.outputs.skip != 'true'
        run: make build
      - if: steps.gate.outputs.skip != 'true'
        run: make test

  proctor:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: make proctor-test

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Dependabot gate
        id: gate
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: steps.gate.outputs.skip != 'true'
        run: npm install -g pnpm@12.6.0
      - if: steps.gate.outputs.skip != 'true'
        run: make web-check
      - if: steps.gate.outputs.skip != 'true'
        run: make web-build

  exam-v1:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install -g pnpm@12.6.0
      - run: make exam-check
      - run: make exam-build

  integration-test:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: (cd backend && go work sync)
      - run: make test-integration

  migration-verification:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: make test-migrations
      - name: Validate Soft Delete Implementation
        run: ./backend/scripts/validate-soft-delete.sh

  lint-contracts:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: (cd backend/libs/proto && buf lint)

  vulnerability-scan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: make vuln

  build-images:
    needs: [build-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - tenant
          - user
          - question-bank
          - assessment
          - submission
          - judge
          - seb
          - notification
          - analytics
        include:
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
          - service: proctor
            context: backend/services/proctor
            file: backend/services/proctor/Dockerfile
          - service: tools
            context: .
            file: deploy/single-server/Dockerfile.tools

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || 'backend' }}
          file: ${{ matrix.file || format('backend/services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/production' && format('ghcr.io/{0}/aethercode-{1}:latest', github.repository_owner, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install cosign
        if: github.ref == 'refs/heads/production'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/production'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: github.ref == 'refs/heads/production'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}

      - name: Attach SBOM to image
        if: github.ref == 'refs/heads/production'
        run: |
          cosign attach sbom \
            --sbom sbom-${{ matrix.service }}.spdx.json \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  helm-lint:
    needs: [build-test]
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint and render all charts
        run: deploy/helm/lint.sh

  # No GitHub-hosted deploy jobs: Actions cannot SSH/reach the campus cluster.
  # Ship images via build-images; apply on the server with deploy/dev/dev-sync.sh
  # or helm from a machine that can reach the cluster.
