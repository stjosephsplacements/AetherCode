name: ci

on:
  pull_request:
  push:
    branches: [production, development]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: (cd backend && go work sync)
      - run: make build
      - run: make test

  integration-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: (cd backend && go work sync)
      - run: make test-integration

  migration-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: make test-migrations
      - name: Validate Soft Delete Implementation
        run: ./backend/scripts/validate-soft-delete.sh

  lint-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: backend/libs/pkg/go.sum
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: (cd backend/libs/proto && buf lint)

  vulnerability-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            backend/libs/pkg/go.sum
            backend/services/*/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln

  build-images:
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - tenant
          - user
          - question-bank
          - assessment
          - submission
          - judge
          - seb
          - notification
          - analytics

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on production)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/production' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install cosign
        if: github.ref == 'refs/heads/production'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/production'
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: github.ref == 'refs/heads/production'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}

      - name: Attach SBOM to image
        if: github.ref == 'refs/heads/production'
        run: |
          cosign attach sbom \
            --sbom sbom-${{ matrix.service }}.spdx.json \
            ghcr.io/${{ github.repository_owner }}/aethercode-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  helm-lint:
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint all service charts
        run: |
          for svc in gateway identity tenant user question-bank assessment \
                      submission judge seb notification analytics; do
            helm lint deploy/helm/platform-service/ \
              -f deploy/helm/platform-service/values-${svc}.yaml || exit 1
          done
