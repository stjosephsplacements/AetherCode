name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            libs/pkg/go.sum
            services/*/go.sum
      - run: go work sync
      - run: make build
      - run: make test

  migration-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: libs/pkg/go.sum
      - run: make test-migrations
      - name: Validate Soft Delete Implementation
        run: ./scripts/validate-soft-delete.sh

  lint-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: libs/pkg/go.sum
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: make fmt-check
      - run: make vet
      - run: make lint
      - run: (cd libs/proto && buf lint)

  vulnerability-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            libs/pkg/go.sum
            services/*/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
