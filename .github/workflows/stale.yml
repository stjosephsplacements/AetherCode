name: stale

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days. It will be closed in 7
            days unless there is further activity.
          close-issue-message: >
            Closing due to inactivity. Reopen if still relevant.
          stale-pr-message: >
            This PR has been inactive for 14 days. It will be closed in 7 days
            unless there is activity.
          close-pr-message: >
            Closing due to inactivity. Reopen if still relevant.
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,breaking-change"
          exempt-pr-labels: "pinned,security,breaking-change"
