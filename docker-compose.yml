name: aethercode

services:
  platform-postgres:
    image: postgres:18.4
    profiles: ["platform"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:?set TENANT_DB_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD}
      QBANK_DB_PASSWORD: ${QBANK_DB_PASSWORD:?set QBANK_DB_PASSWORD}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?set ASSESSMENT_DB_PASSWORD}
      SUBMISSION_DB_PASSWORD: ${SUBMISSION_DB_PASSWORD:?set SUBMISSION_DB_PASSWORD}
      SEB_DB_PASSWORD: ${SEB_DB_PASSWORD:?set SEB_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
    volumes:
      - platform-postgres-data:/var/lib/postgresql
      - ./deploy/database/platform/dev-init.sh:/docker-entrypoint-initdb.d/00-aethercode-roles.sh:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.14.3-alpine
    profiles: ["platform"]
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports:
      - 127.0.0.1:4222:4222
      - 127.0.0.1:8222:8222
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform-redis:
    image: redis:8.8.0
    profiles: ["platform"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - platform-redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing images; this is Chainguard's maintained build,
    # pinned by digest. It has bash but no curl/wget/mc, hence the health check.
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    profiles: ["platform"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["platform"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  platform-postgres-data:
  nats-data:
  platform-redis-data:
  minio-data:
