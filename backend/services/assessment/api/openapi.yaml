      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        proctor_policy_id: {$ref: '#/components/schemas/UUID'}
        version_number: {type: integer, minimum: 1, format: int64}
        policy: {type: object}
        policy_checksum: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {enum: [draft, published, retired]}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    Exam:
      type: object
      required: [id, tenant_id, lifecycle_state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        external_reference: {type: string, maxLength: 1000}
        lifecycle_state: {enum: [draft, published, archived]}
        version: {type: integer, minimum: 1, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    CreateExamVersion:
      type: object
      additionalProperties: false
      required: [expected_exam_version, title, instructions_markdown, opens_at, closes_at, duration_seconds, proctor_policy_version_id]
      properties:
        expected_exam_version: {type: integer, minimum: 1, format: int64}
        title: {type: string, minLength: 1, maxLength: 300}
        instructions_markdown: {type: string, minLength: 1, maxLength: 100000}
        opens_at: {$ref: '#/components/schemas/Timestamp'}
        closes_at: {$ref: '#/components/schemas/Timestamp'}
        duration_seconds: {type: integer, minimum: 60, maximum: 43200, format: int64}
        proctor_policy_version_id: {$ref: '#/components/schemas/UUID'}
    ExamVersion:
      type: object
      required: [id, tenant_id, exam_id, version_number, content_version, attempt_limit, title, instructions_markdown, opens_at, closes_at, duration_seconds, proctor_policy_version_id, status, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        exam_id: {$ref: '#/components/schemas/UUID'}
        version_number: {type: integer, minimum: 1, format: int64}
        content_version: {type: integer, minimum: 1, format: int64}
        attempt_limit: {type: integer, minimum: 1, maximum: 20, format: int64}
        title: {type: string, maxLength: 1000}
        instructions_markdown: {type: string, maxLength: 1000}
        opens_at: {$ref: '#/components/schemas/Timestamp'}
        closes_at: {$ref: '#/components/schemas/Timestamp'}
        duration_seconds: {type: integer, format: int64}
        proctor_policy_version_id: {$ref: '#/components/schemas/UUID'}
        status: {enum: [draft, published, retired]}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AddExamSection:
      type: object
      additionalProperties: false
      required: [expected_content_version, position, title, instructions_markdown]
      properties:
        expected_content_version: {type: integer, minimum: 1, format: int64}
        position: {type: integer, minimum: 1, format: int64}
        title: {type: string, minLength: 1, maxLength: 300}
