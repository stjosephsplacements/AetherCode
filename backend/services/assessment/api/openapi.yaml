        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Remove a section from a draft exam version
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_content_version]
              properties:
                expected_content_version: {type: integer, format: int64}
      responses:
        '204': {description: Section removed, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/sections/{section_id}/items/{item_id}:
    parameters:
    - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    - {name: exam_version_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    - {name: section_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    - {name: item_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    patch:
      summary: Change the marks of a question in a draft exam
