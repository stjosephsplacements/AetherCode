openapi: 3.1.1
info:
  title: AetherCode Assessment API
  version: 1.0.0
  description: >-
    Tenant-scoped immutable exam authoring, publication, and assignment API.
    Every business request requires a bearer identity assertion and receives a
    fresh central authorization decision before a FORCE RLS transaction opens.
servers:
- url: https://assessment.internal.aethercode.in
  description: AetherCode assessment service — internal platform endpoint (production)
  x-internal: true
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Process is alive, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database, authorization projection: null, and broker are ready: null, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {description: A required dependency is unavailable, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /v1/tenants/{tenant_id}/proctor-policies:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: List proctor policies for the tenant
      description: Staff-scoped. Returns policies ordered by created_at DESC, id DESC.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      - name: lifecycle_state
        in: query
        schema: {enum: [draft, active, archived]}
      responses:
        '200': {$ref: '#/components/responses/ProctorPolicyPage'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create a proctor-policy aggregate
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
      responses:
        '201': {$ref: '#/components/responses/ProctorPolicy'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/proctor-policies/{proctor_policy_id}:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ProctorPolicyID'}
    get:
      summary: Read a proctor-policy aggregate
      responses:
        '200': {$ref: '#/components/responses/ProctorPolicy'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/proctor-policies/{proctor_policy_id}/versions:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ProctorPolicyID'}
    get:
      summary: List versions of a proctor policy
      description: Staff-scoped. Returns versions ordered by version_number DESC, id DESC.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      - name: status
        in: query
        schema: {enum: [draft, published]}
      responses:
        '200': {$ref: '#/components/responses/ProctorPolicyVersionPage'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Add the next immutable proctor-policy draft
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_policy_version, policy]
              properties:
                expected_policy_version: {type: integer, minimum: 1, format: int64}
                policy: {type: object}
      responses:
        '201': {$ref: '#/components/responses/ProctorPolicyVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/proctor-policy-versions/{proctor_policy_version_id}:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ProctorPolicyVersionID'}
    get:
      summary: Read an immutable proctor-policy version snapshot
      responses:
        '200': {$ref: '#/components/responses/ProctorPolicyVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/proctor-policy-versions/{proctor_policy_version_id}/publish:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ProctorPolicyVersionID'}
    post:
      summary: Publish a draft proctor-policy version
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      responses:
        '200': {$ref: '#/components/responses/ProctorPolicyVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exams:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: List exams for the tenant
      description: >-
        Staff-scoped. Returns non-deleted exams ordered by created_at DESC,
        id DESC. Pagination uses keyset cursors.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      - name: lifecycle_state
        in: query
        schema: {enum: [draft, published, archived]}
      responses:
        '200': {$ref: '#/components/responses/ExamPage'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create an exam aggregate
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                external_reference: {type: string, minLength: 1, maxLength: 160}
      responses:
        '201': {$ref: '#/components/responses/Exam'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exams/{exam_id}:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamID'}
    get:
      summary: Read an exam aggregate
      responses:
        '200': {$ref: '#/components/responses/Exam'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    patch:
      summary: Update an exam's external reference
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, format: int64, minimum: 1}
                external_reference: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200': {$ref: '#/components/responses/Exam'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete an exam
      description: Sets deleted_at on the exam aggregate. Requires a reason.
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Exam soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exams/{exam_id}/hard:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamID'}
    delete:
      summary: Permanently delete an exam
      description: Irreversible hard delete. Only permitted for draft exams with no candidate assignments. Requires a reason.
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Exam permanently deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exams/{exam_id}/versions:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamID'}
    get:
      summary: List versions of an exam
      description: >-
        Staff-scoped. Returns non-deleted exam versions ordered by
        version_number DESC, id DESC. Pagination uses keyset cursors.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      - name: status
        in: query
        schema: {enum: [draft, published, retired]}
      responses:
        '200': {$ref: '#/components/responses/ExamVersionPage'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create the next draft exam version from a published proctor policy
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExamVersion'}
      responses:
        '201': {$ref: '#/components/responses/ExamVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/content:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    get:
      summary: The version's sections, items and assignment rules (staff exam builder)
      description: >-
        Authorized like reading the exam version. Items carry the pinned
        question title; rules carry how many candidates they reached.
      responses:
        '200':
          description: Exam version content
          content:
            application/json:
              schema:
                type: object
                required: [sections, assignment_rules]
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {$ref: '#/components/schemas/UUID'}
                        position: {type: integer, format: int64}
                        title: {type: string, maxLength: 1000}
                        instructions_markdown: {type: string, maxLength: 1000}
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {$ref: '#/components/schemas/UUID'}
                              position: {type: integer, format: int64}
                              question_id: {$ref: '#/components/schemas/UUID'}
                              question_version_id: {$ref: '#/components/schemas/UUID'}
                              question_title: {type: [string, 'null'], maxLength: 1000}
                              maximum_score: {type: string, maxLength: 1000}
                          maxItems: 200
                    maxItems: 200
                  assignment_rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {$ref: '#/components/schemas/UUID'}
                        target_type: {enum: [department, batch, placement_department, student]}
                        target_id: {$ref: '#/components/schemas/UUID'}
                        available_from: {$ref: '#/components/schemas/Timestamp'}
                        available_until: {$ref: '#/components/schemas/Timestamp'}
                        disabled_at: {type: [string, 'null'], format: date-time}
                        assigned_candidates: {type: integer, minimum: 0, format: int64}
                    maxItems: 200
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}:
    patch:
      summary: Edit a draft exam's title, instructions, window or duration
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_content_version]
              properties:
                expected_content_version: {type: integer, format: int64}
                title: {type: string, maxLength: 1000}
                instructions_markdown: {type: string, maxLength: 1000}
                opens_at: {type: string, format: date-time}
                closes_at: {type: string, format: date-time}
                duration_seconds: {type: integer, format: int64}
      responses:
        '204': {description: Updated, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    get:
      summary: Read an exam-version snapshot and its optimistic content version
      responses:
        '200': {$ref: '#/components/responses/ExamVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/sections:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    post:
      summary: Add a section to a draft exam version
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddExamSection'}
      responses:
        '201': {$ref: '#/components/responses/ExamSection'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/sections/{section_id}/items:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    - {$ref: '#/components/parameters/SectionID'}
    post:
      summary: Snapshot a question version into a draft exam section
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      description: Assessment resolves the published question version through the Question Bank and pins its immutable question ID encrypted evaluation and sample bundle references (object key, checksum, KMS key reference), and the version's time limit, memory limit and supported languages, all carried in candidate assignment snapshots. An unknown or unpublished version returns 404; an unreachable Question Bank returns 503.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddExamItem'}
      responses:
        '201': {$ref: '#/components/responses/ExamItem'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/publish:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    post:
      summary: Publish a complete draft exam version
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_content_version]
              properties:
                expected_content_version: {type: integer, minimum: 1, format: int64}
      responses:
        '200': {$ref: '#/components/responses/ExamVersion'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/assignment-rules:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    post:
      summary: Create an assignment rule for a published exam version
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAssignmentRule'}
      responses:
        '201': {$ref: '#/components/responses/AssignmentRule'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/assignment-rules/{assignment_rule_id}/candidate-assignments:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/AssignmentRuleID'}
    post:
      summary: Materialize a direct student assignment
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      description: >-
        This endpoint is intentionally limited to a student-target rule whose
        target ID equals candidate_id. Department, batch, and placement rules
        remain durable rules until an authoritative User affiliation projection
        is consumed; they are never expanded from caller-supplied membership data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_id]
              properties:
                candidate_id: {$ref: '#/components/schemas/UUID'}
      responses:
        '201': {$ref: '#/components/responses/CandidateAssignment'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/candidate-assignments:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: List candidate assignments for the calling candidate
      description: >-
        Candidate-scoped. Returns only assignments where the bearer subject
        matches the candidate_id. Pagination uses keyset cursors ordered by
        available_from DESC, id DESC.
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      - name: lifecycle_state
        in: query
        schema: {enum: [assigned, revoked, started, completed, expired]}
      responses:
        '200': {$ref: '#/components/responses/CandidateAssignmentPage'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/candidate-assignments/{candidate_assignment_id}:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/CandidateAssignmentID'}
    get:
      summary: Read one candidate assignment
      responses:
        '200': {$ref: '#/components/responses/CandidateAssignment'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/candidate-assignments/{candidate_assignment_id}/revoke:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/CandidateAssignmentID'}
    post:
      summary: Revoke a candidate assignment
      description: >-
        Uses optimistic versioning and emits the next
        assessment.candidate_assignment.snapshot.v1 state with lifecycle_state
        set to revoked. Assessment owns no Submission attempt state; Submission
        applies the newer snapshot by cancelling its nonterminal attempts and
        queued or dispatched evaluations.
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1, format: int64}
      responses:
        '200': {$ref: '#/components/responses/CandidateAssignment'}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/sections/{section_id}:
