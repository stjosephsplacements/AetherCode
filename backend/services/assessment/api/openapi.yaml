                expected_content_version: {type: integer, format: int64}
      responses:
        '204': {description: Item removed, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/items/{item_id}/repin:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/ExamVersionID'}
    - {name: item_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    post:
      summary: Repin an exam item to a corrected question version
      description: >-
        Points the item at a newer published version of its question and
        re-dispatches candidate assignments for regrading (ADR-0039).
        No idempotency key: the regrade side-effect is best-effort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question_version_id]
              properties:
                question_version_id: {$ref: '#/components/schemas/UUID'}
      responses:
        '200':
          description: Repin applied; indicates how many assignments were re-dispatched.
          content:
            application/json:
              schema:
                type: object
                required: [assignments_resent]
                properties:
                  assignments_resent: {type: integer, minimum: 0, format: int64}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/assignment-rules/{assignment_rule_id}/window:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/AssignmentRuleID'}
    post:
      summary: Move the close time of a published assignment rule window
      description: >-
        Extends or shortens available_until for a live assignment rule and
        propagates the change to all active candidate assignments (ADR-0040).
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available_until]
              properties:
                available_until: {$ref: '#/components/schemas/Timestamp'}
      responses:
        '200':
          description: Window moved; indicates how many candidate assignments were updated.
          content:
            application/json:
              schema:
                type: object
                required: [assignments_moved]
                properties:
                  assignments_moved: {type: integer, minimum: 0, format: int64}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        default: {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC 8725. Include as: Authorization: Bearer <token>.'
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ProctorPolicyID:
      name: proctor_policy_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ProctorPolicyVersionID:
      name: proctor_policy_version_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ExamID:
      name: exam_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ExamVersionID:
      name: exam_version_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    SectionID:
      name: section_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    AssignmentRuleID:
      name: assignment_rule_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    CandidateAssignmentID:
      name: candidate_assignment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$'}
  responses:
    ProctorPolicy:
      description: Proctor policy aggregate
      content: {application/json: {schema: {$ref: '#/components/schemas/ProctorPolicy'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    ProctorPolicyPage:
      description: Keyset page of proctor policies
      content: {application/json: {schema: {$ref: '#/components/schemas/ProctorPolicyPage'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    ProctorPolicyVersion:
      description: Immutable proctor policy snapshot
      content: {application/json: {schema: {$ref: '#/components/schemas/ProctorPolicyVersion'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    ProctorPolicyVersionPage:
