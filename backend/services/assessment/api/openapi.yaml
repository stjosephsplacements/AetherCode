    - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    - {name: exam_version_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    - {name: section_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
