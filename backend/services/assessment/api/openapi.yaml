          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_content_version, maximum_score]
              properties:
                expected_content_version: {type: integer, format: int64}
                maximum_score: {type: string, description: Decimal, up to 4 places: null, maxLength: 1000}
      responses:
        '204': {description: Updated, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Remove a question item from a draft exam section
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
