openapi: 3.1.1
info:
  title: AetherCode Question Bank API
  version: 1.0.0
  description: |
    Global authoring and consumption API for immutable coding-question versions.
    Every protected request requires a bearer access token; mutations also
    require an Idempotency-Key. Encrypted object references are accepted only
    on writes and are never returned by this browser-facing API.
servers:
- url: https://question-bank.internal.aethercode.in
  description: AetherCode question-bank service — internal platform endpoint (production)
  x-internal: true
security:
- BearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Service is alive, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database, outbox publisher: null, and authorization projection are ready: null, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /v1/questions:
    get:
      operationId: listPublishedQuestions
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        description: >-
          draft lists the caller's own questions whose latest version is a
          draft, and review lists drafts of any author waiting for a review,
          oldest request first (the other filters do not apply); otherwise
          published questions are listed.
        schema: {type: string, enum: [published, draft, review]}
      - name: difficulty
        in: query
        schema: {type: string, enum: [easy, medium, hard]}
      - name: tag
        in: query
        schema: {type: string, maxLength: 1000}
      - name: language
        in: query
        schema: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Latest published version for each active question
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionDetailPage'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      operationId: createQuestion
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required: [slug]
                properties:
                  slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
                  category_id: {$ref: '#/components/schemas/UUID', description: The category to file the question under; Uncategorised when omitted (ADR-0052).}
              - {$ref: '#/components/schemas/VersionContentInput'}
      responses:
        '201': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/questions/{question_id}:
    get:
      operationId: getPublishedQuestion
      parameters: [$ref: '#/components/parameters/QuestionID']
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete a question aggregate
      parameters:
      - {$ref: '#/components/parameters/QuestionID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Question soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/questions/{question_id}/hard:
    delete:
      summary: Permanently delete a question aggregate
      description: Irreversible. Only permitted for questions with no published versions.
      parameters:
      - {$ref: '#/components/parameters/QuestionID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Question permanently deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/questions/{question_id}/versions:
    get:
      operationId: listQuestionVersions
      parameters:
      - {$ref: '#/components/parameters/QuestionID'}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string, enum: [draft, published]}
      responses:
        '200':
          description: All versions of the question visible to the caller
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionVersionPage'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      operationId: createDraftQuestionVersion
      parameters:
      - {$ref: '#/components/parameters/QuestionID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required: [expected_question_revision]
                properties:
                  expected_question_revision: {type: integer, minimum: 1, format: int64}
              - {$ref: '#/components/schemas/VersionContentInput'}
      responses:
        '201': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/questions/{question_id}/archive:
    post:
      operationId: archiveQuestion
      parameters:
      - {$ref: '#/components/parameters/QuestionID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_revision]
              properties:
                expected_question_revision: {type: integer, minimum: 1, format: int64}
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}:
    patch:
      summary: Edit a draft's title, statement, difficulty or limits; a published version is immutable
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_question_version]
              properties:
                expected_question_version: {type: integer, format: int64}
                title: {type: string, maxLength: 1000}
                prompt_markdown: {type: string, maxLength: 1000}
                difficulty: {type: string, enum: [easy, medium, hard]}
                time_limit_ms: {type: integer, format: int64}
                memory_limit_kib: {type: integer, format: int64}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    get:
      operationId: getQuestionVersion
      parameters: [$ref: '#/components/parameters/QuestionVersionID']
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete a question version
      parameters: [$ref: '#/components/parameters/QuestionVersionID']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Version soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}/hard:
    delete:
      summary: Permanently delete a draft question version
      parameters: [$ref: '#/components/parameters/QuestionVersionID']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Version permanently deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}/tests:
    put:
      operationId: setQuestionVersionTests
      description: >-
        Replaces every test of a draft version from plaintext. The service builds
        the evaluation, sample and hidden bundles, encrypts them and stores them;
        clients never handle object keys or ciphertext. The body is limited to
        1 MiB in total. Not Idempotency-Key based: a replayed request fails with
        409 because expected_question_version has moved on.
      parameters: [$ref: '#/components/parameters/QuestionVersionID']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_question_version, tests]
              properties:
                expected_question_version: {type: integer, minimum: 1, format: int64}
                tests:
                  type: array
                  minItems: 2
                  maxItems: 500
                  description: At least one sample and one hidden test.
                  items:
                    type: object
                    additionalProperties: false
                    required: [input, expected_output, sample]
                    properties:
                      input: {type: string, maxLength: 1048576}
                      expected_output: {type: string, maxLength: 1048576}
                      sample: {type: boolean, description: Students see full input and output only for sample tests.}
                      weight: {type: integer, minimum: 1, maximum: 100, default: 1, format: int64}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}/assets:
    post:
      operationId: addQuestionAsset
      parameters:
      - {$ref: '#/components/parameters/QuestionVersionID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_kind, object_reference, content_type, byte_size, expected_question_version]
              properties:
                asset_kind: {type: string, enum: [attachment, starter_code, reference_solution]}
                object_reference: {$ref: '#/components/schemas/EncryptedObjectReference'}
                content_type: {type: string, minLength: 1, maxLength: 180}
                byte_size: {type: integer, minimum: 1, format: int64}
                expected_question_version: {type: integer, minimum: 1, format: int64}
      responses:
        '201': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}/tags:
    put:
      operationId: replaceQuestionVersionTags
      parameters:
      - {$ref: '#/components/parameters/QuestionVersionID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_version, tags]
              properties:
                expected_question_version: {type: integer, minimum: 1, format: int64}
                tags:
                  type: array
                  maxItems: 50
                  items: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/question-versions/{question_version_id}/publish:
    post:
      operationId: publishQuestionVersion
      parameters:
      - {$ref: '#/components/parameters/QuestionVersionID'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_version]
              properties:
                expected_question_version: {type: integer, minimum: 1, format: int64}
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/review-policy:
    get:
      summary: Whether publishing needs a review (ADR-0044)
      operationId: getReviewPolicy
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                type: object
                required: [require_review]
                properties:
                  require_review: {type: boolean}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/categories:
    get:
      summary: Every category with its question count, Uncategorised last (ADR-0052)
      operationId: listCategories
      security: [bearerAuth: []]
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: {type: array, items: {$ref: '#/components/schemas/Category'}, maxItems: 200}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Add a category, open to every author. A name that exists in any letter case returns the existing one.
      operationId: createCategory
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                parent_id: {$ref: '#/components/schemas/UUID', description: Files it as a sub-category of a top-level category (ADR-0058).}
      responses:
        '200':
          description: The category, and whether this call created it.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, created]
                properties:
                  id: {$ref: '#/components/schemas/UUID'}
                  name: {type: string, maxLength: 1000}
                  parent_id: {type: [string, 'null'], format: uuid, maxLength: 36}
                  created: {type: boolean}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/categories/{category_id}:
    patch:
      summary: Rename a category, move it (parent_id, null for top level), or both. Administrators only; Uncategorised is built in (ADR-0058).
      operationId: renameCategory
      security: [bearerAuth: []]
      parameters: [{name: category_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                parent_id: {type: [string, 'null'], format: uuid, description: A top-level category with no sub-categories may only move under another top-level one; null moves to top level., maxLength: 36}
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema: {type: object, required: [id, name], properties: {id: {$ref: '#/components/schemas/UUID'}, name: {type: string, maxLength: 1000}, parent_id: {type: [string, 'null'], format: uuid, maxLength: 36}}}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Delete (or merge) a category. Administrators only. Its questions move to move_to, or to Uncategorised. Refused (409) while it has sub-categories.
      operationId: deleteCategory
      security: [bearerAuth: []]
      parameters:
      - {name: category_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: move_to, in: query, required: false, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200':
          description: Where the questions went.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, moved_to, moved]
                properties:
                  deleted: {$ref: '#/components/schemas/UUID'}
                  moved_to: {$ref: '#/components/schemas/UUID'}
