          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Run or submit code on a practice problem (ADR-0041)
      description: >-
        mode run uses the sample tests, or input when given; mode submit uses
        every test. One job per student may be in flight and at most 12 across
        the platform, so exams keep Judge's other slots.
      security:
      - bearerAuth: []
      parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
      - {name: question_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, mode, source]
              properties:
                language: {type: string, maxLength: 1000}
                mode: {type: string, enum: [run, submit]}
                source: {type: string, maxLength: 65536}
                input: {type: string, maxLength: 65536, description: Runs only.}
      responses:
        '202': {description: 'Started: { id }; poll the run.', headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {description: Invalid language, mode: null, code or input.: null, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '404': {description: Not a practice problem., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '409': {description: A run is already in flight, or practice is busy.: null, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {description: Judge unavailable., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/practice/submissions/{submission_id}:
    get:
      summary: One of the student's runs, with its code (ADR-0041)
      security:
      - bearerAuth: []
      parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
      - {name: submission_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
      responses:
        '200': {description: The run and its source., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '404': {description: Not the caller's run., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC 8725. Include as: Authorization: Bearer <token>.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 1000}
      description: Opaque keyset cursor from the previous page's next_cursor field
    QuestionID:
      name: question_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    QuestionVersionID:
      name: question_version_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  responses:
    Problem:
      description: Stable error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    QuestionDetail:
      description: Question and one immutable version summary
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionDetail'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    QuestionVersion:
      description: Safe version metadata without encrypted object locations
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionVersion'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem401:
      description: Unauthorized — missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem500:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem429:
      description: Too many requests — rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
  schemas:
    UUID:
      type: string
      format: uuid
      maxLength: 36
    QuestionDetailPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionDetail'}
          maxItems: 200
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page
          maxLength: 1000
    QuestionVersionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionVersion'}
          maxItems: 200
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page
          maxLength: 1000
    EncryptedObjectReference:
      type: object
      required: [object_key, checksum, encryption_key_reference]
      properties:
        object_key: {type: string, minLength: 1, maxLength: 1024}
        checksum: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        encryption_key_reference: {type: string, minLength: 1, maxLength: 1024}
    VersionContentInput:
      type: object
      required: [title, prompt_markdown, difficulty, supported_languages, time_limit_ms, memory_limit_kib, tags]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        prompt_markdown: {type: string, minLength: 1, maxLength: 200000}
        difficulty: {type: string, enum: [easy, medium, hard]}
        supported_languages:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
        time_limit_ms: {type: integer, minimum: 50, maximum: 600000, format: int64}
        memory_limit_kib: {type: integer, minimum: 1024, maximum: 4194304, format: int64}
        tags:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 80}
    Tag:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, maxLength: 1000}
    Question:
      type: object
      required: [id, slug, lifecycle_state, created_at, version]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        slug: {type: string, maxLength: 1000}
        lifecycle_state: {type: string, enum: [draft, published, archived]}
        created_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1, format: int64}
        category_id: {$ref: '#/components/schemas/UUID'}
        category: {$ref: '#/components/schemas/CategoryRef'}
    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, maxLength: 1000}
    Category:
      type: object
      required: [id, name, question_count]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, minLength: 1, maxLength: 80}
        parent_id: {type: [string, 'null'], format: uuid, description: Null for a top-level category., maxLength: 36}
        question_count: {type: integer, minimum: 0, description: Live questions filed directly under it., format: int64}
        question_count_total: {type: integer, minimum: 0, description: Top-level categories only; own questions plus those in its sub-categories., format: int64}
    QuestionVersion:
      type: object
      required: [id, question_id, version_number, title, prompt_markdown, difficulty, supported_languages, time_limit_ms, memory_limit_kib, status, created_at, version, tags, sample_test_case_count, hidden_test_case_count, asset_count]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        question_id: {$ref: '#/components/schemas/UUID'}
        version_number: {type: integer, minimum: 1, format: int64}
        title: {type: string, maxLength: 1000}
        prompt_markdown: {type: string, maxLength: 1000}
        difficulty: {type: string, enum: [easy, medium, hard]}
        supported_languages: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
        time_limit_ms: {type: integer, format: int64}
        memory_limit_kib: {type: integer, format: int64}
        status: {type: string, enum: [draft, published, retired]}
        review_requested_at: {type: string, format: date-time}
        review_requested_by: {type: string, format: uuid, maxLength: 36}
        assigned_reviewer_id: {type: string, format: uuid, maxLength: 36}
        published_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1, format: int64}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}, maxItems: 200}
        sample_test_case_count: {type: integer, minimum: 0, format: int64}
        hidden_test_case_count: {type: integer, minimum: 0, format: int64}
        asset_count: {type: integer, minimum: 0, format: int64}
    QuestionDetail:
      type: object
      required: [question, question_version]
      properties:
        question: {$ref: '#/components/schemas/Question'}
        question_version: {$ref: '#/components/schemas/QuestionVersion'}
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
