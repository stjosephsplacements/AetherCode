openapi: 3.1.1
info:
  title: AetherCode Question Bank API
  version: 1.0.0
  description: |
    Global authoring and consumption API for immutable coding-question versions.
    Every protected request requires a bearer access token; mutations also
    require an Idempotency-Key. Encrypted object references are accepted only
    on writes and are never returned by this browser-facing API.
servers:
  - url: /
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Service is alive}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database, outbox publisher, and authorization projection are ready}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/questions:
    get:
      operationId: listPublishedQuestions
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - {$ref: '#/components/parameters/Cursor'}
        - name: status
          in: query
          description: >-
            draft lists the caller's own questions whose latest version is a
            draft, and review lists drafts of any author waiting for a review,
            oldest request first (the other filters do not apply); otherwise
            published questions are listed.
          schema: {type: string, enum: [published, draft, review]}
        - name: difficulty
          in: query
          schema: {type: string, enum: [easy, medium, hard]}
        - name: tag
          in: query
          schema: {type: string}
        - name: language
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Latest published version for each active question
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionDetailPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createQuestion
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [slug]
                  properties:
                    slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
                    category_id:
                      {$ref: '#/components/schemas/UUID', description: The category to file the question under; Uncategorised when omitted (ADR-0052).}
                - {$ref: '#/components/schemas/VersionContentInput'}
      responses:
        '201': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/questions/{question_id}:
    get:
      operationId: getPublishedQuestion
      parameters: [{$ref: '#/components/parameters/QuestionID'}]
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/questions/{question_id}/versions:
    get:
      operationId: listQuestionVersions
      parameters:
        - {$ref: '#/components/parameters/QuestionID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - {$ref: '#/components/parameters/Cursor'}
        - name: status
          in: query
          schema: {type: string, enum: [draft, published]}
      responses:
        '200':
          description: All versions of the question visible to the caller
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionVersionPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createDraftQuestionVersion
      parameters:
        - {$ref: '#/components/parameters/QuestionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [expected_question_revision]
                  properties:
                    expected_question_revision: {type: integer, minimum: 1}
                - {$ref: '#/components/schemas/VersionContentInput'}
      responses:
        '201': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/questions/{question_id}/archive:
    post:
      operationId: archiveQuestion
      parameters:
        - {$ref: '#/components/parameters/QuestionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_revision]
              properties:
                expected_question_revision: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}:
    patch:
      summary: Edit a draft's title, statement, difficulty or limits; a published version is immutable
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [expected_question_version]
                properties:
                  expected_question_version: {type: integer, format: int64}
                  title: {type: string}
                  prompt_markdown: {type: string}
                  difficulty: {type: string, enum: [easy, medium, hard]}
                  time_limit_ms: {type: integer}
                  memory_limit_kib: {type: integer}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    get:
      operationId: getQuestionVersion
      parameters: [{$ref: '#/components/parameters/QuestionVersionID'}]
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/tests:
    put:
      operationId: setQuestionVersionTests
      description: >-
        Replaces every test of a draft version from plaintext. The service builds
        the evaluation, sample and hidden bundles, encrypts them and stores them;
        clients never handle object keys or ciphertext. The body is limited to
        1 MiB in total. Not Idempotency-Key based: a replayed request fails with
        409 because expected_question_version has moved on.
      parameters: [{$ref: '#/components/parameters/QuestionVersionID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_question_version, tests]
              properties:
                expected_question_version: {type: integer, minimum: 1}
                tests:
                  type: array
                  minItems: 2
                  maxItems: 500
                  description: At least one sample and one hidden test.
                  items:
                    type: object
                    additionalProperties: false
                    required: [input, expected_output, sample]
                    properties:
                      input: {type: string, maxLength: 1048576}
                      expected_output: {type: string, maxLength: 1048576}
                      sample: {type: boolean, description: Students see full input and output only for sample tests.}
                      weight: {type: integer, minimum: 1, maximum: 100, default: 1}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/assets:
    post:
      operationId: addQuestionAsset
      parameters:
        - {$ref: '#/components/parameters/QuestionVersionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_kind, object_reference, content_type, byte_size, expected_question_version]
              properties:
                asset_kind: {type: string, enum: [attachment, starter_code, reference_solution]}
                object_reference: {$ref: '#/components/schemas/EncryptedObjectReference'}
                content_type: {type: string, minLength: 1, maxLength: 180}
                byte_size: {type: integer, minimum: 1}
                expected_question_version: {type: integer, minimum: 1}
      responses:
        '201': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/tags:
    put:
      operationId: replaceQuestionVersionTags
      parameters:
        - {$ref: '#/components/parameters/QuestionVersionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_version, tags]
              properties:
                expected_question_version: {type: integer, minimum: 1}
                tags:
                  type: array
                  maxItems: 50
                  items: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {$ref: '#/components/responses/QuestionVersion'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/publish:
    post:
      operationId: publishQuestionVersion
      parameters:
        - {$ref: '#/components/parameters/QuestionVersionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_version]
              properties:
                expected_question_version: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/review-policy:
    get:
      summary: Whether publishing needs a review (ADR-0044)
      operationId: getReviewPolicy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                type: object
                required: [require_review]
                properties:
                  require_review: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/categories:
    get:
      summary: Every category with its question count, Uncategorised last (ADR-0052)
      operationId: listCategories
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      summary: Add a category, open to every author. A name that exists in any letter case returns the existing one.
      operationId: createCategory
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: The category, and whether this call created it.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, created]
                properties:
                  id: {$ref: '#/components/schemas/UUID'}
                  name: {type: string}
                  created: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/categories/{category_id}:
    patch:
      summary: Rename a category. Administrators only; Uncategorised is built in.
      operationId: renameCategory
      security: [{bearerAuth: []}]
      parameters: [{name: category_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: The renamed category.
          content:
            application/json:
              schema: {type: object, required: [id, name], properties: {id: {$ref: '#/components/schemas/UUID'}, name: {type: string}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Delete (or merge) a category. Administrators only. Its questions move to move_to, or to Uncategorised.
      operationId: deleteCategory
      security: [{bearerAuth: []}]
      parameters:
        - {name: category_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: move_to, in: query, required: false, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200':
          description: Where the questions went.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, moved_to, moved]
                properties:
                  deleted: {$ref: '#/components/schemas/UUID'}
                  moved_to: {$ref: '#/components/schemas/UUID'}
                  moved: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/questions/{question_id}/category:
    put:
      summary: File a question under a category, at any time, without a new version (ADR-0052)
      operationId: setQuestionCategory
      security: [{bearerAuth: []}]
      parameters: [{name: question_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [category_id], properties: {category_id: {$ref: '#/components/schemas/UUID'}}}
      responses:
        '200':
          description: The category the question is now in.
          content:
            application/json:
              schema: {type: object, required: [category_id], properties: {category_id: {$ref: '#/components/schemas/UUID'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/questions/{question_id}/tags:
    put:
      summary: Replace a question's tags, at any time, without a new version. An empty list clears them (ADR-0052).
      operationId: setQuestionTags
      security: [{bearerAuth: []}]
      parameters: [{name: question_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [tags], properties: {tags: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 80}}}}
      responses:
        '200':
          description: The question's tags now.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags: {type: array, items: {type: object, required: [id, name], properties: {id: {$ref: '#/components/schemas/UUID'}, name: {type: string}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/tags:
    get:
      summary: The tags in use, most used first, for suggestions
      operationId: listTags
      security: [{bearerAuth: []}]
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}]
      responses:
        '200':
          description: The tags with how many questions carry each.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags: {type: array, items: {type: object, required: [name, count], properties: {name: {type: string}, count: {type: integer}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/languages:
    get:
      summary: The languages an author may offer in a coding question (ADR-0050)
      operationId: listLanguages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The languages, in display order. Operators change them with QBANK_LANGUAGES.
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      required: [key, name, editor]
                      properties:
                        key: {type: string, description: The Judge language key stored in supported_languages.}
                        name: {type: string, description: What people see.}
                        editor: {type: string, description: The code editor's syntax mode.}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/request-review:
    post:
      summary: Ask for a review of a draft (ADR-0044)
      description: >-
        Marks the draft as waiting for review. When the deployment requires
        reviews, publishing needs this, and the publisher must be a different
        member of staff than the requester.
      operationId: requestQuestionReview
      parameters:
        - {$ref: '#/components/parameters/QuestionVersionID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_question_version]
              properties:
                expected_question_version: {type: integer, minimum: 1}
                reviewer_id: {type: string, format: uuid, description: Optional; a hint for the queue, not a restriction}
      responses:
        '200': {$ref: '#/components/responses/QuestionDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/question-versions/{question_version_id}/export:
    get:
      summary: Export a question with all of its tests (ADR-0032)
      description: >-
        Requires write on question_exports, which only college and platform
        administrators can obtain. Every export is recorded. The response
        includes hidden tests in plain text.
      security:
        - bearerAuth: []
      parameters:
        - name: question_version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The question file (format aethercode.question.v1).
          content:
            application/json:
              schema: { type: object }
        '403': { description: Not an administrator. }
        '404': { description: No such question version. }
        '409': { description: The version has no tests yet. }
  /v1/question-versions/{question_version_id}/choices:
    put:
      summary: Make a draft multiple-choice (ADR-0035)
      description: 2 to 10 options, the indexes of the correct ones, and whether several may be chosen.
      security:
        - bearerAuth: []
      parameters:
        - name: question_version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_question_version, choices, correct_choices, multiple_choice]
              properties:
                expected_question_version: { type: integer }
                choices: { type: array, minItems: 2, maxItems: 10, items: { type: string } }
                correct_choices: { type: array, minItems: 1, items: { type: integer, minimum: 0 } }
                multiple_choice: { type: boolean }
      responses:
        '200': { description: The question version. }
        '400': { description: Invalid options or answer. }
        '409': { description: Stale revision or not a draft. }
  /v1/questions/{question_id}/audience:
    put:
      summary: Use a question for tests or for practice (ADR-0041)
      description: Practice questions are visible to every student; test questions never are. Requires write on questions.
      security:
        - bearerAuth: []
      parameters:
        - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience]
              properties:
                audience: { type: string, enum: [test, practice] }
      responses:
        '200': { description: The new audience. }
        '400': { description: Not test or practice. }
        '404': { description: No such question. }
  /v1/tenants/{tenant_id}/practice/questions:
    get:
      summary: The practice catalogue with the student's progress (ADR-0041)
      description: >-
        Published coding questions marked for practice, each with title,
        difficulty, tags, and whether the caller solved or attempted it.
        Authorized as the bearer on practice_submissions in their tenant.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: An array of practice problems. }
  /v1/tenants/{tenant_id}/practice/progress:
    get:
      summary: The student's practice totals (ADR-0041)
      description: Problems available and solved, by difficulty, submissions, accepted ones, and days with practice in the last year (IST).
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The totals. }
  /v1/tenants/{tenant_id}/practice/questions/{question_id}:
    get:
      summary: One practice problem with its sample tests (ADR-0041)
      description: The latest published version's statement, languages, limits, tags and decrypted sample tests. Hidden tests are never returned.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The problem. }
        '404': { description: Not a practice problem. }
  /v1/tenants/{tenant_id}/practice/questions/{question_id}/submissions:
    get:
      summary: The student's last 20 runs and submissions on a problem (ADR-0041)
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Runs, newest first, with per-test verdicts and, for sample runs, output. }
    post:
      summary: Run or submit code on a practice problem (ADR-0041)
      description: >-
        mode run uses the sample tests, or input when given; mode submit uses
        every test. One job per student may be in flight and at most 12 across
        the platform, so exams keep Judge's other slots.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: question_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, mode, source]
              properties:
                language: { type: string }
                mode: { type: string, enum: [run, submit] }
                source: { type: string, maxLength: 65536 }
                input: { type: string, maxLength: 65536, description: Runs only. }
      responses:
        '202': { description: 'Started: { id }; poll the run.' }
        '400': { description: Invalid language, mode, code or input. }
        '404': { description: Not a practice problem. }
        '409': { description: A run is already in flight, or practice is busy. }
        '503': { description: Judge unavailable. }
  /v1/tenants/{tenant_id}/practice/submissions/{submission_id}:
    get:
      summary: One of the student's runs, with its code (ADR-0041)
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: submission_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The run and its source. }
        '404': { description: Not the caller's run. }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
      description: Opaque keyset cursor from the previous page's next_cursor field
    QuestionID:
      name: question_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    QuestionVersionID:
      name: question_version_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  responses:
    Problem:
      description: Stable error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    QuestionDetail:
      description: Question and one immutable version summary
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionDetail'}
    QuestionVersion:
      description: Safe version metadata without encrypted object locations
      content:
        application/json:
          schema: {$ref: '#/components/schemas/QuestionVersion'}
  schemas:
    UUID:
      type: string
      format: uuid
    QuestionDetailPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionDetail'}
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page
    QuestionVersionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionVersion'}
        next_cursor:
          type: string
          description: Opaque keyset cursor; absent on the last page
    EncryptedObjectReference:
      type: object
      required: [object_key, checksum, encryption_key_reference]
      properties:
        object_key: {type: string, minLength: 1, maxLength: 1024}
        checksum: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        encryption_key_reference: {type: string, minLength: 1, maxLength: 1024}
    VersionContentInput:
      type: object
      required: [title, prompt_markdown, difficulty, supported_languages, time_limit_ms, memory_limit_kib, tags]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        prompt_markdown: {type: string, minLength: 1, maxLength: 200000}
        difficulty: {type: string, enum: [easy, medium, hard]}
        supported_languages:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
        time_limit_ms: {type: integer, minimum: 50, maximum: 600000}
        memory_limit_kib: {type: integer, minimum: 1024, maximum: 4194304}
        tags:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 80}
    Tag:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
    Question:
      type: object
      required: [id, slug, lifecycle_state, created_at, version]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        slug: {type: string}
        lifecycle_state: {type: string, enum: [draft, published, archived]}
        created_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
        category_id: {$ref: '#/components/schemas/UUID'}
        category: {$ref: '#/components/schemas/CategoryRef'}
    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
    Category:
      type: object
      required: [id, name, question_count]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, minLength: 1, maxLength: 80}
        question_count: {type: integer, minimum: 0, description: Live questions filed under it.}
    QuestionVersion:
      type: object
      required: [id, question_id, version_number, title, prompt_markdown, difficulty, supported_languages, time_limit_ms, memory_limit_kib, status, created_at, version, tags, sample_test_case_count, hidden_test_case_count, asset_count]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        question_id: {$ref: '#/components/schemas/UUID'}
        version_number: {type: integer, minimum: 1}
        title: {type: string}
        prompt_markdown: {type: string}
        difficulty: {type: string, enum: [easy, medium, hard]}
        supported_languages: {type: array, items: {type: string}}
        time_limit_ms: {type: integer}
        memory_limit_kib: {type: integer}
        status: {type: string, enum: [draft, published, retired]}
        review_requested_at: {type: string, format: date-time}
        review_requested_by: {type: string, format: uuid}
        assigned_reviewer_id: {type: string, format: uuid}
        published_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        sample_test_case_count: {type: integer, minimum: 0}
        hidden_test_case_count: {type: integer, minimum: 0}
        asset_count: {type: integer, minimum: 0}
    QuestionDetail:
      type: object
      required: [question, question_version]
      properties:
        question: {$ref: '#/components/schemas/Question'}
        question_version: {$ref: '#/components/schemas/QuestionVersion'}
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
