[project]
name = "aethercode-proctor"
version = "0.1.0"
description = "GPU-accelerated webcam proctoring for AetherCode exams"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "nats-py>=2.9",
    "ultralytics>=8.3",
    "minio>=7.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11",
    "numpy>=2",
    "mediapipe>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proctor"]
