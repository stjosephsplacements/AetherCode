openapi: 3.1.1
info:
  title: AetherCode User API
  version: 1.0.0
  description: >-
    Canonical User profile, student, membership, and authorization-management
    workflows. Every protected request carries a bearer identity assertion,
    receives a fresh central authorization decision, and executes inside one
    FORCE RLS transaction.
servers:
- url: https://user.internal.aethercode.in
  description: AetherCode user service — internal platform endpoint (production)
  x-internal: true
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200': {description: Process is alive, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      security: []
      summary: Readiness probe
      responses:
        '200': {description: Database and authorization dependencies are ready, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {description: A required dependency is unavailable, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
  /v1/me:
    get:
      summary: The caller's own active roles (ADR-0023)
      description: >-
        Verifies the gateway's identity assertion and returns the caller's
        active role assignments. There is no resource parameter: a caller can
        only read themselves. student is set from a self-scoped student role.
      responses:
        '200':
          description: The caller's roles; sent with Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [principal_id, roles, student]
                properties:
                  principal_id: {type: string, format: uuid, maxLength: 36}
                  roles:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [role_name, scope_kind]
                      properties:
                        role_name: {enum: [super_admin, placement_user, college_admin, department_user, mentor, student]}
                        scope_kind: {enum: [platform, college, department, batch, placement_department, self]}
                        tenant_id: {type: string, format: uuid, maxLength: 36}
                        scope_id: {type: string, format: uuid, maxLength: 36}
                    maxItems: 200
                  student:
                    oneOf:
                    - type: 'null'
                    - type: object
                      additionalProperties: false
                      required: [tenant_id]
                      properties:
                        tenant_id: {type: string, format: uuid, maxLength: 36}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Problem401'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/profiles/{principal_id}:
    parameters:
    - $ref: '#/components/parameters/PrincipalID'
    - $ref: '#/components/parameters/TenantQueryID'
    put:
      summary: Create or update a principal profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpsertProfile'}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/profiles/{principal_id}/public:
    parameters:
    - $ref: '#/components/parameters/PrincipalID'
    - $ref: '#/components/parameters/TenantQueryID'
    get:
      summary: The caller's own public profile settings (ADR-0062)
      responses:
        '200': {description: Settings, whether or not the profile is public: null, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '403': {$ref: '#/components/responses/Problem403'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    put:
      summary: Publish, change or hide the caller's public profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicProfile'}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {description: The address is taken, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/public/profiles/{slug}:
    parameters:
    - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,30}$'}}
    get:
      summary: An enabled public profile. No sign-in; the gateway allows this one route anonymously.
      security: []
      responses:
        '200': {description: The profile, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '404': {description: No such profile, or it is hidden: null, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: List students in a tenant
      description: >-
        Cursor-paginated (created_at DESC, id DESC). All filters are optional.
        Batch filter matches students with an active batch affiliation for that batch.
        Department filter matches students with any active department membership for that department.
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1000}}
      - {name: status, in: query, schema: {enum: [pending, active, inactive, withdrawn]}}
      - {name: batch_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: department_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: enrollment_number_prefix, in: query, schema: {type: string, maxLength: 1000}}
      responses:
        '200': {$ref: '#/components/responses/StudentPage'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Enroll an active student with current department affiliations
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollStudent'}
      responses:
        '201': {$ref: '#/components/responses/Student'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/roster:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: Staff console student roster with batch, departments, profile and mentors (ADR-0057)
      description: >-
        Richer than the plain student list; joins batch and department names and
        mentor assignments. Sorted and filtered server-side.
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50, format: int64}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1000}}
      - {name: status, in: query, schema: {enum: [pending, active, inactive, withdrawn]}}
      - {name: batch_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: department_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: placement_department_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: q, in: query, schema: {type: string, maxLength: 1000}, description: Free-text search on enrollment number and name}
      - {name: sort, in: query, schema: {enum: [enrollment_number, name]}, description: Default enrollment_number}
      - {name: order, in: query, schema: {enum: [asc, desc]}}
      responses:
        '200':
          description: Roster page
          content: {application/json: {schema: {$ref: '#/components/schemas/StudentPage'}}}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/{student_id}:
    patch:
      summary: Edit a student's enrolment number or admission date (YYYY-MM-DD, empty clears it)
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enrollment_number: {type: string, maxLength: 1000}
                admitted_at: {type: string, maxLength: 1000}
      responses:
        '200': {description: The updated student, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'401'":
          $ref: '#/components/responses/Problem401'
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/StudentID'
    get:
      summary: Read a student and current department affiliations
      responses:
        '200': {$ref: '#/components/responses/Student'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Student soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/{student_id}/hard:
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/StudentID'
    delete:
      summary: Permanently delete a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Student permanently deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/role-assignments:
    get:
      summary: List role assignments
      description: >-
        Cursor-paginated (created_at DESC, id DESC). Tenant scope is read from
        the X-Tenant-ID header; absent header means platform-wide listing for
        callers with sufficient privilege. All query filters are optional.
      parameters:
      - {name: X-Tenant-ID, in: header, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1000}}
      - {name: principal_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: role_name, in: query, schema: {enum: [super_admin, placement_user, college_admin, department_user, mentor, student]}}
      - {name: scope_kind, in: query, schema: {enum: [platform, college, department, batch, placement_department, self]}}
      responses:
        '200': {$ref: '#/components/responses/RoleAssignmentPage'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    post:
      summary: Grant a scoped canonical role
      description: >-
        tenant_id and scope_id are required or omitted according to scope_kind.
        No Idempotency-Key header is accepted by this v1 endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignRole'}
      responses:
        '201': {$ref: '#/components/responses/RoleAssignment'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/role-assignments/{role_assignment_id}/revoke:
    parameters: [$ref: '#/components/parameters/RoleAssignmentID']
    post:
      summary: Revoke an active role assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeRole'}
      responses:
        '200': {$ref: '#/components/responses/RoleAssignment'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/placement-departments/{placement_department_id}/staff/{principal_id}:
    parameters:
    - $ref: '#/components/parameters/PlacementDepartmentID'
    - $ref: '#/components/parameters/PrincipalID'
    put:
      summary: Create or reactivate a placement-department staff membership
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetPlacementStaffMembership'}
      responses:
        '200': {$ref: '#/components/responses/PlacementStaffMembership'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/batches/{batch_id}/mentors:
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/BatchID'
    get:
      summary: List mentor assignments for a batch
      description: Cursor-paginated (created_at DESC, id DESC).
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1000}}
      responses:
        '200': {$ref: '#/components/responses/MentorBatchAssignmentPage'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/batches/{batch_id}/mentors/{principal_id}:
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/BatchID'
    - $ref: '#/components/parameters/PrincipalID'
    put:
      summary: Assign a mentor to an active tenant batch
      responses:
        '200': {$ref: '#/components/responses/MentorBatchAssignment'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/{student_id}/batch-affiliation:
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/StudentID'
    get:
      summary: Read a student's current batch affiliation and optimistic version
      responses:
        '200': {$ref: '#/components/responses/StudentBatchAffiliation'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
    put:
      summary: Set a student's current batch affiliation
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      description: >-
        The expected_version is the current affiliation version returned by
        this resource's GET operation. The User
        service validates an active student and an active Tenant-owned batch,
        closes any prior immutable history interval, and emits a durable
        user.student_batch_affiliation.snapshot.v1 event in the same
        transaction. The required Idempotency-Key is persisted with the exact
        request fingerprint and successful response, so a retry is replayed
        without a second state transition or outbox event.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetStudentBatchAffiliation'}
      responses:
        '200': {$ref: '#/components/responses/StudentBatchAffiliation'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/{student_id}/batch-affiliation/revoke:
    parameters:
    - $ref: '#/components/parameters/TenantID'
    - $ref: '#/components/parameters/StudentID'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      summary: Revoke a student's current batch affiliation
      description: >-
        expected_version prevents stale revocations. The required
        Idempotency-Key replays the durable response for an equivalent retry.
        The response and durable snapshot contain batch_id as null when
        lifecycle_state is inactive.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndStudentBatchAffiliation'}
      responses:
        '200': {$ref: '#/components/responses/StudentBatchAffiliation'}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        "'500'":
          $ref: '#/components/responses/Problem500'
        "'429'":
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/students/import:
    parameters: [$ref: '#/components/parameters/TenantID']
    post:
      summary: Import students with generated passwords (ADR-0019)
      description: >-
        Creates an account for each new roll number (username = lowercase roll
        number), enrolls it in the college and places it in the batch. Roll
        numbers the college already has are skipped. Any invalid row, or a
        username already taken anywhere, rejects the whole file. Generated
        passwords appear only in this response, which is never cached. At most
        500 rows per call; authorized as write on accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportStudents'}
      responses:
        '201':
          description: Imported students with their one-time passwords, and skipped roll numbers
          content: {application/json: {schema: {$ref: '#/components/schemas/StudentImportResult'}}}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
