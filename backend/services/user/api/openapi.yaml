components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC 8725. Include as: Authorization: Bearer <token>.'
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    TenantQueryID:
      name: tenant_id
      in: query
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    PrincipalID:
      name: principal_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    StudentID:
      name: student_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    RoleAssignmentID:
      name: role_assignment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    PlacementDepartmentID:
      name: placement_department_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    BatchID:
