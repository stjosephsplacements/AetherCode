  schemas:
    UUID:
      type: string
      format: uuid
      maxLength: 36
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
    UpsertProfile:
      type: object
      additionalProperties: false
      required: [given_name, family_name]
      properties:
        given_name: {type: string, minLength: 1, maxLength: 120}
        family_name: {type: string, minLength: 1, maxLength: 120}
        preferred_name: {type: string, maxLength: 120}
    Profile:
      type: object
      additionalProperties: false
      required: [principal_id, given_name, family_name, version, created_at, updated_at]
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
        given_name: {type: string, maxLength: 1000}
        family_name: {type: string, maxLength: 1000}
        preferred_name: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 1, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    EnrollStudent:
      type: object
      additionalProperties: false
      required: [principal_id, enrollment_number, college_department_id, placement_department_id]
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
        enrollment_number: {type: string, minLength: 1, maxLength: 128}
        college_department_id: {$ref: '#/components/schemas/UUID'}
        placement_department_id: {$ref: '#/components/schemas/UUID'}
    Student:
      type: object
      additionalProperties: false
      required: [id, principal_id, tenant_id, enrollment_number, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        principal_id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        enrollment_number: {type: string, maxLength: 1000}
        status: {enum: [pending, active, inactive, withdrawn]}
        college_department_id: {$ref: '#/components/schemas/UUID'}
        placement_department_id: {$ref: '#/components/schemas/UUID'}
        version: {type: integer, minimum: 1, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AssignRole:
      type: object
      additionalProperties: false
      required: [principal_id, role_name, scope_kind]
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
        role_name: {enum: [super_admin, placement_user, college_admin, department_user, mentor, student]}
        scope_kind: {enum: [platform, college, department, batch, placement_department, self]}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        scope_id: {$ref: '#/components/schemas/UUID'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    RevokeRole:
      type: object
      additionalProperties: false
      properties:
        tenant_id: {$ref: '#/components/schemas/UUID'}
    RoleAssignment:
      type: object
      additionalProperties: false
      # created_at added in feat/list-endpoints-cursor-pagination: needed for cursor pagination on list endpoints
      required: [id, principal_id, role_name, scope_kind, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        principal_id: {$ref: '#/components/schemas/UUID'}
        role_name: {type: string, maxLength: 1000}
        scope_kind: {type: string, maxLength: 1000}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        scope_id: {$ref: '#/components/schemas/UUID'}
        status: {enum: [active, revoked]}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, minimum: 1, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        root: {type: boolean, description: 'The first super_admin, which granted itself. Its access is fixed.'}
    PublicProfile:
      type: object
      properties:
        slug: {type: string, maxLength: 1000}
        enabled: {type: boolean}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        content:
          type: object
          properties:
            name: {type: string, maxLength: 80}
            headline: {type: string, maxLength: 120}
            bio: {type: string, maxLength: 600}
            college: {type: string, maxLength: 120}
            batch: {type: string, maxLength: 80}
            skills: {type: array, maxItems: 12, items: {type: string, maxLength: 30}}
            links:
              type: array
              maxItems: 12
              items: {type: object, properties: {platform: {type: string, maxLength: 1000}, handle: {type: string, maxLength: 1000}, url: {type: string, maxLength: 1000}}}
    SetPlacementStaffMembership:
      type: object
      additionalProperties: false
      properties:
        tenant_id: {$ref: '#/components/schemas/UUID'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    PlacementStaffMembership:
      type: object
      additionalProperties: false
      required: [id, principal_id, placement_department_id, status, version]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        principal_id: {$ref: '#/components/schemas/UUID'}
        placement_department_id: {$ref: '#/components/schemas/UUID'}
        status: {enum: [active, revoked]}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, minimum: 1, format: int64}
    MentorBatchAssignment:
      type: object
      additionalProperties: false
      # created_at added in feat/list-endpoints-cursor-pagination: needed for cursor pagination on list endpoints
      required: [id, mentor_principal_id, tenant_id, batch_id, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        mentor_principal_id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        batch_id: {$ref: '#/components/schemas/UUID'}
        status: {enum: [active, ended]}
        version: {type: integer, minimum: 1, format: int64}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    StudentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Student'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    MentorBatchAssignmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MentorBatchAssignment'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    RoleAssignmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RoleAssignment'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    SetStudentBatchAffiliation:
      type: object
      additionalProperties: false
      required: [batch_id, expected_version]
      properties:
        batch_id: {$ref: '#/components/schemas/UUID'}
        expected_version: {type: integer, minimum: 1, format: int64}
    EndStudentBatchAffiliation:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1, format: int64}
    StudentBatchAffiliation:
      type: object
      additionalProperties: false
      required: [student_id, tenant_id, batch_id, lifecycle_state, version, updated_at]
      properties:
        student_id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        batch_id:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        lifecycle_state: {enum: [active, inactive]}
        version: {type: integer, minimum: 1, format: int64}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ImportStudents:
      type: object
      additionalProperties: false
      required: [batch_id, college_department_id, placement_department_id, students]
      properties:
        batch_id: {$ref: '#/components/schemas/UUID'}
        college_department_id: {$ref: '#/components/schemas/UUID'}
        placement_department_id: {$ref: '#/components/schemas/UUID'}
        students:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [roll_number, name]
            properties:
              roll_number: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
              name: {type: string, minLength: 1, maxLength: 200}
              email: {type: string, format: email}
    StudentImportResult:
      type: object
      additionalProperties: false
      required: [imported, skipped]
      properties:
        imported:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [student_id, principal_id, roll_number, name, username, password]
            properties:
              student_id: {$ref: '#/components/schemas/UUID'}
              principal_id: {$ref: '#/components/schemas/UUID'}
              roll_number: {type: string, maxLength: 1000}
              name: {type: string, maxLength: 1000}
              username: {type: string, maxLength: 1000}
              password: {type: string, format: password}
          maxItems: 200
        skipped: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [principal_id, display_name, password]
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
        username: {type: string, maxLength: 1000}
        display_name: {type: string, maxLength: 1000}
        password: {type: string, format: password}
    CreateStaff:
      type: object
      additionalProperties: false
      required: [username, display_name, role]
      properties:
        username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        email: {type: string, format: email}
        display_name: {type: string, minLength: 1, maxLength: 200}
        role: {enum: [college_admin, department_user]}
        department_id: {$ref: '#/components/schemas/UUID'}
    StaffAccount:
      allOf:
      - $ref: '#/components/schemas/IssuedCredential'
      - type: object
        required: [role_assignment]
        properties:
          role_assignment: {$ref: '#/components/schemas/RoleAssignment'}
    Role:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, tier, position, permissions]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        name: {type: string, maxLength: 1000}
        tier: {type: integer, format: int64}
        position: {type: integer, format: int64}
        permissions: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
    RoleOverwrite:
      type: object
      additionalProperties: false
      required: [id, tenant_id, node_kind, node_id, target_kind, target_id, allow, deny]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        node_kind: {type: string, maxLength: 1000}
        node_id: {$ref: '#/components/schemas/UUID'}
        target_kind: {type: string, maxLength: 1000}
        target_id: {$ref: '#/components/schemas/UUID'}
        allow: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
        deny: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
        granted_by: {$ref: '#/components/schemas/UUID'}
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
