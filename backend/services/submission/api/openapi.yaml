      required: [id, origin, lifecycle_state, queued_at, completed_at, verdict, score, passed_units, total_units, verdict_counts]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        origin: {type: string, enum: [item_submit, final]}
        lifecycle_state: {type: string, enum: [queued, dispatched, completed, failed, cancelled]}
        language_id: {type: string, maxLength: 1000}
        revision_number: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        queued_at: {type: string, format: date-time, maxLength: 35}
        completed_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        verdict: {type: [string, 'null'], maxLength: 1000}
        score: {type: [string, 'null'], description: Null until judged., maxLength: 1000}
        maximum_score: {type: string, maxLength: 1000}
        passed_units: {type: [integer, 'null'], format: int64, maximum: 2147483647, minimum: 0}
        total_units: {type: [integer, 'null'], format: int64, maximum: 2147483647, minimum: 0}
        verdict_counts:
          type: object
          additionalProperties: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
          description: Number of tests per verdict, for example {"accepted":3,"wrong_answer":1}.
    Paper:
      type: object
      additionalProperties: false
      required: [attempt_id, exam_id, title, instructions_markdown, items]
      properties:
        attempt_id: {$ref: '#/components/schemas/UUID'}
        exam_id: {$ref: '#/components/schemas/UUID'}
        title: {type: string, maxLength: 1000}
        instructions_markdown: {type: string, maxLength: 1000}
        items:
          type: array
