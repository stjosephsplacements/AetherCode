openapi: 3.1.1
info:
  title: AetherCode Submission API
  version: 1.0.0
  description: Candidate-safe attempt, answer-revision, and submission workflows.
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Service is alive.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '500':
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      responses:
        '200':
          description: Service and required durable dependencies are ready.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '503':
          description: A required dependency is unavailable.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '500':
          $ref: '#/components/responses/Problem500'
  /v1/tenants/{tenant_id}/attempts:
    get:
      summary: List the calling candidate's attempts (keyset paged)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          format: int64
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1000
      - name: exam_version_id
        in: query
        schema:
          $ref: '#/components/schemas/UUID'
      - name: lifecycle_state
        in: query
        schema:
          type: string
          enum: [created, active, submitted, grading, graded, expired, cancelled]
      responses:
        '200':
          description: One keyset page of attempts. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Start an assignment-backed candidate attempt
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_assignment_id]
              properties:
                candidate_assignment_id:
                  $ref: '#/components/schemas/UUID'
      responses:
        '201':
          description: Attempt started or returned from the same idempotency key. A newly created attempt emits one internal submission.attempt_started.v1 event; a replay emits none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '409': {$ref: '#/components/responses/Problem409'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}:
    get:
      summary: Read the caller's own attempt
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: Candidate-owned attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete an attempt
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Attempt soft-deleted., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/hard:
    delete:
      summary: Permanently delete an attempt
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Attempt permanently deleted., headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/paper:
    get:
      summary: The exam paper of an attempt the caller owns (ADR-0023)
      description: >-
        The exam's title and instructions, each item's statement, limits and
        languages in exam order, and the caller's latest saved answer for each
        item, decrypted. Sent with Cache-Control no-store. Items snapshotted
        before Assessment migration 000026 are titled "Question N" with an
        empty statement.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: The paper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paper'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '503': {$ref: '#/components/responses/Problem503'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/unit-results:
    get:
      summary: Candidate's per-unit breakdown for their own attempt
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: Per-unit test results for the attempt.
          content:
            application/json:
              schema: {type: object}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/judge-receipts:
    get:
      summary: Full per-unit judge receipts for staff (requires judge_receipts capability)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: Full unit results with judge receipts. Requires a staff-scoped role.
          content:
            application/json:
              schema: {type: object}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/answers:
    get:
      summary: List answer-revision metadata for an attempt the caller owns (keyset paged)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          format: int64
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1000
      - name: exam_item_id
        in: query
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: One keyset page of answer revisions. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRevisionPage'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/answers/{exam_item_id}:
    put:
      summary: Append an immutable answer revision
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - name: exam_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - language
              - source
              - expected_attempt_version
              properties:
                language:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9+_.-]{0,79}$'
                  description: >-
                    Judge language key (c, cpp17, java, python3, javascript, go).
                    Must be one of the exam item's supported languages, which
                    are pinned from the question version; otherwise 400.
                  maxLength: 1000
                source:
                  type: string
                  maxLength: 65536
                  description: >-
                    The candidate's source code, at most 64 KiB. The service
                    encrypts it and stores the ciphertext under a key it
                    chooses; the plaintext is never persisted in PostgreSQL.
                expected_attempt_version:
                  type: integer
                  minimum: 1
                  format: int64
                  maximum: 2147483647
      responses:
        '201':
          description: Immutable answer revision accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRevision'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '503': {$ref: '#/components/responses/Problem503'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/submit:
    post:
      summary: Submit an attempt and accept durable grading work
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_attempt_version]
              properties:
                expected_attempt_version:
                  type: integer
                  minimum: 1
                  format: int64
                  maximum: 2147483647
      responses:
        '202':
          description: The attempt and its durable evaluation work were accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attempt, evaluation_request_count]
                properties:
                  attempt:
                    $ref: '#/components/schemas/Attempt'
                  evaluation_request_count:
                    type: integer
                    minimum: 0
                    format: int64
                    maximum: 2147483647
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/items/{exam_item_id}/runs:
    post:
      summary: Run source against the item's sample tests (ADR-0021)
      description: >-
        Accepted while the attempt is active, up to the deadline plus a
        15-second grace. At most two runs per attempt may be in flight. A 409
        carries a message meant for the candidate (no sample tests, the exam
        has ended, a run is still being judged).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/ExamItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, source]
              properties:
                language:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9+_.-]{0,79}$'
                  description: One of the exam item's supported languages; otherwise 400.
                  maxLength: 1000
                source:
                  type: string
                  minLength: 1
                  maxLength: 65536
                input:
                  type: string
                  maxLength: 65536
                  description: >-
                    Run against this stdin instead of the sample tests
                    (ADR-0025). The result has one unit whose stdout is the
                    program's output; its verdict compares against empty
                    expected output.
      responses:
        '202':
          description: The run was queued for Judge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRun'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '429':
          description: Too many runs; retry after the Retry-After seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        '503': {$ref: '#/components/responses/Problem503'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
    get:
      summary: List the caller's runs of one item, newest first (keyset paged)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/ExamItemID'
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1000}
      responses:
        '200':
          description: One page of runs with unit counts. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRunPage'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/items/{exam_item_id}/submissions:
    post:
      summary: Submit the item's latest saved code against all of its tests (ADR-0025)
      description: >-
        Accepted while the attempt is active, up to the deadline plus a
        15-second grace. Submitting unchanged code returns the existing
        evaluation. At most two evaluations may be open per attempt; a 409
        carries a message meant for the candidate. Each item scores its best
        evaluation when the attempt is graded.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/ExamItemID'
      responses:
        '202':
          description: The evaluation was queued for Judge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSubmission'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem400'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '429':
          description: Too many runs and submissions; retry after the Retry-After seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
    get:
      summary: The caller's evaluations of one item, newest first (at most 50)
      description: Hidden tests appear only as counts per verdict.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AttemptID'
      - $ref: '#/components/parameters/ExamItemID'
      responses:
        '200':
          description: The item's evaluations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ItemSubmission'}
                    maxItems: 200
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
