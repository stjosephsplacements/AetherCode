openapi: 3.1.1
info:
  title: AetherCode Submission API
  version: 1.0.0
  description: Candidate-safe attempt, answer-revision, and submission workflows.
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Service is alive.
  /readyz:
    get:
      responses:
        '200':
          description: Service and required durable dependencies are ready.
        '503':
          description: A required dependency is unavailable.
  /v1/tenants/{tenant_id}/attempts:
    get:
      summary: List the calling candidate's attempts (keyset paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: exam_version_id
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [created, active, submitted, grading, graded, expired, cancelled]
      responses:
        '200':
          description: One keyset page of attempts. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      summary: Start an assignment-backed candidate attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_assignment_id]
              properties:
                candidate_assignment_id:
                  $ref: '#/components/schemas/UUID'
      responses:
        '201':
          description: Attempt started or returned from the same idempotency key. A newly created attempt emits one internal submission.attempt_started.v1 event; a replay emits none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}:
    get:
      summary: Read the caller's own attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: Candidate-owned attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/paper:
    get:
      summary: The exam paper of an attempt the caller owns (ADR-0023)
      description: >-
        The exam's title and instructions, each item's statement, limits and
        languages in exam order, and the caller's latest saved answer for each
        item, decrypted. Sent with Cache-Control no-store. Items snapshotted
        before Assessment migration 000026 are titled "Question N" with an
        empty statement.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: The paper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paper'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '503': { $ref: '#/components/responses/Problem503' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/answers:
    get:
      summary: List answer-revision metadata for an attempt the caller owns (keyset paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: exam_item_id
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: One keyset page of answer revisions. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRevisionPage'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/answers/{exam_item_id}:
    put:
      summary: Append an immutable answer revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - name: exam_item_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - language
                - source
                - expected_attempt_version
              properties:
                language:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9+_.-]{0,79}$'
                  description: >-
                    Judge language key (c, cpp17, java, python3, javascript, go).
                    Must be one of the exam item's supported languages, which
                    are pinned from the question version; otherwise 400.
                source:
                  type: string
                  maxLength: 65536
                  description: >-
                    The candidate's source code, at most 64 KiB. The service
                    encrypts it and stores the ciphertext under a key it
                    chooses; the plaintext is never persisted in PostgreSQL.
                expected_attempt_version:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Immutable answer revision accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRevision'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '503': { $ref: '#/components/responses/Problem503' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/submit:
    post:
      summary: Submit an attempt and accept durable grading work
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_attempt_version]
              properties:
                expected_attempt_version:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: The attempt and its durable evaluation work were accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attempt, evaluation_request_count]
                properties:
                  attempt:
                    $ref: '#/components/schemas/Attempt'
                  evaluation_request_count:
                    type: integer
                    minimum: 0
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/items/{exam_item_id}/runs:
    post:
      summary: Run source against the item's sample tests (ADR-0021)
      description: >-
        Accepted while the attempt is active, up to the deadline plus a
        15-second grace. At most two runs per attempt may be in flight. A 409
        carries a message meant for the candidate (no sample tests, the exam
        has ended, a run is still being judged).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/ExamItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [language, source]
              properties:
                language:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9+_.-]{0,79}$'
                  description: One of the exam item's supported languages; otherwise 400.
                source:
                  type: string
                  minLength: 1
                  maxLength: 65536
                input:
                  type: string
                  maxLength: 65536
                  description: >-
                    Run against this stdin instead of the sample tests
                    (ADR-0025). The result has one unit whose stdout is the
                    program's output; its verdict compares against empty
                    expected output.
      responses:
        '202':
          description: The run was queued for Judge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRun'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429':
          description: Too many runs; retry after the Retry-After seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem503' }
    get:
      summary: List the caller's runs of one item, newest first (keyset paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/ExamItemID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: One page of runs with unit counts. next_cursor is absent on the final page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRunPage'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/items/{exam_item_id}/submissions:
    post:
      summary: Submit the item's latest saved code against all of its tests (ADR-0025)
      description: >-
        Accepted while the attempt is active, up to the deadline plus a
        15-second grace. Submitting unchanged code returns the existing
        evaluation. At most two evaluations may be open per attempt; a 409
        carries a message meant for the candidate. Each item scores its best
        evaluation when the attempt is graded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/ExamItemID'
      responses:
        '202':
          description: The evaluation was queued for Judge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemSubmission'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429':
          description: Too many runs and submissions; retry after the Retry-After seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      summary: The caller's evaluations of one item, newest first (at most 50)
      description: Hidden tests appear only as counts per verdict.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/ExamItemID'
      responses:
        '200':
          description: The item's evaluations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemSubmission' }
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/runs/{run_id}:
    get:
      summary: Return one of the caller's runs with every sample test's input and output
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - name: run_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: The run. units is empty until the run has completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRun'
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/monitor:
    get:
      summary: Live monitor of an exam version, for staff (ADR-0027)
      description: >-
        One row per active assignment with the newest attempt, answered items
        and the finalized or best-so-far score, plus the release state and
        announcements. Requires read on score_summaries.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Problem403' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/results-release:
    put:
      summary: Show or hide an exam version's results to its candidates (ADR-0027)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [released]
              properties:
                released: { type: boolean }
      responses:
        '200':
          description: The release time, null when hidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results_released_at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Problem403' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/extensions:
    post:
      summary: Add time to one in-progress attempt, or to all of them (ADR-0027)
      description: >-
        Without attempt_id, every attempt of the version still in progress
        gets the time. Ended attempts are never reopened; naming one is a 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 240 }
                attempt_id: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: How many attempts got the time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  extended_attempts: { type: integer }
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/announcements:
    post:
      summary: Show a message to every candidate of the exam version (ADR-0027)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: The announcement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/Problem400' }
        '403': { $ref: '#/components/responses/Problem403' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/live:
    get:
      summary: The caller's current deadline and the exam's announcements (ADR-0027)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: The live state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lifecycle_state: { type: string }
                  submission_deadline: { type: string, format: date-time }
                  announcements:
                    type: array
                    items: { $ref: '#/components/schemas/Announcement' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/result:
    get:
      summary: The caller's score, once staff release results (ADR-0027)
      description: >-
        {"released": false} until results are released and the attempt is
        graded; then the total and each question's best score.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/review:
    get:
      summary: Staff review of one attempt (ADR-0029)
      description: >-
        Each question's latest code, its evaluations with per-verdict counts,
        the finalized score and the attempt's event log. Requires read on
        judge_receipts, which no candidate can hold.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/similarity:
    get:
      summary: Code similarity report for staff (ADR-0031)
      description: >-
        Per question, pairs of attempts whose latest code shares most of its
        unusual structure (score 0.6 to 1, at most 100 pairs). Requires read
        on judge_receipts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/Problem403' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/choices/{exam_item_id}:
    put:
      summary: Save the caller's selection for a multiple-choice item (ADR-0035)
      description: Indexes are the options' authored indexes from the paper; an empty list clears the answer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
        - $ref: '#/components/parameters/ExamItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selected]
              properties:
                selected: { type: array, maxItems: 10, items: { type: integer, minimum: 0 } }
      responses:
        '200': { description: The saved selection. }
        '400': { $ref: '#/components/responses/Problem400' }
        '409': { $ref: '#/components/responses/Problem409' }
  /v1/tenants/{tenant_id}/exam-versions/{exam_version_id}/integrity:
    put:
      summary: Require fullscreen and block outside pastes for an exam (ADR-0037)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ExamVersionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                require_fullscreen: { type: boolean }
                block_external_paste: { type: boolean }
      responses:
        '200': { description: The saved settings. }
        '403': { $ref: '#/components/responses/Problem403' }
  /v1/tenants/{tenant_id}/attempts/{attempt_id}/events:
    post:
      summary: Record an integrity event for the caller's attempt (ADR-0037)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AttemptID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [blur, paste, fullscreen_exit] }
      responses:
        '204': { description: Recorded (or ignored once the attempt ended). }
        '400': { $ref: '#/components/responses/Problem400' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    AttemptID:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ExamVersionID:
      name: exam_version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ExamItemID:
      name: exam_item_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    Announcement:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        body: { type: string }
        created_at: { type: string, format: date-time }
    UUID:
      type: string
      format: uuid
    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Attempt:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - exam_id
        - exam_version_id
        - candidate_id
        - candidate_assignment_id
        - attempt_number
        - lifecycle_state
        - available_from
        - submission_deadline
        - version
        - created_at
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        tenant_id: { $ref: '#/components/schemas/UUID' }
        exam_id: { $ref: '#/components/schemas/UUID' }
        exam_version_id: { $ref: '#/components/schemas/UUID' }
        candidate_id: { $ref: '#/components/schemas/UUID' }
        candidate_assignment_id: { $ref: '#/components/schemas/UUID' }
        attempt_number: { type: integer, minimum: 1 }
        lifecycle_state:
          type: string
          enum: [created, active, submitted, grading, graded, expired, cancelled]
        available_from: { type: string, format: date-time }
        submission_deadline: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        submitted_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    AnswerRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - attempt_id
        - exam_item_id
        - revision_number
        - language_id
        - created_at
        - created_by
        - attempt_version
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        tenant_id: { $ref: '#/components/schemas/UUID' }
        attempt_id: { $ref: '#/components/schemas/UUID' }
        exam_item_id: { $ref: '#/components/schemas/UUID' }
        revision_number: { type: integer, minimum: 1 }
        language_id: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/UUID' }
        attempt_version: { type: integer, minimum: 1 }
    AttemptPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        next_cursor:
          type: string
    AnswerRevisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnswerRevision'
        next_cursor:
          type: string
    CodeRun:
      type: object
      additionalProperties: false
      required: [id, attempt_id, exam_item_id, language_id, lifecycle_state, verdict, created_at, completed_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        attempt_id: { $ref: '#/components/schemas/UUID' }
        exam_item_id: { $ref: '#/components/schemas/UUID' }
        language_id: { type: string }
        lifecycle_state: { type: string, enum: [queued, dispatched, completed, failed, cancelled] }
        verdict: { type: [string, 'null'] }
        passed_units: { type: integer, minimum: 0, description: Listed runs only. }
        total_units: { type: integer, minimum: 0, description: Listed runs only. }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        units:
          type: array
          description: A fetched run only. Sample tests are not confidential, so nothing is redacted.
          items:
            type: object
            additionalProperties: false
            required: [unit_number, verdict]
            properties:
              unit_number: { type: integer, minimum: 0 }
              verdict: { type: string }
              stdin: { type: [string, 'null'] }
              expected_output: { type: [string, 'null'] }
              stdout: { type: [string, 'null'] }
              stderr: { type: [string, 'null'] }
              compile_output: { type: [string, 'null'] }
              execution_time_ms: { type: [integer, 'null'] }
              memory_kib: { type: [integer, 'null'] }
    ItemSubmission:
      type: object
      additionalProperties: false
      required: [id, origin, lifecycle_state, queued_at, completed_at, verdict, score, passed_units, total_units, verdict_counts]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        origin: { type: string, enum: [item_submit, final] }
        lifecycle_state: { type: string, enum: [queued, dispatched, completed, failed, cancelled] }
        language_id: { type: string }
        revision_number: { type: integer, minimum: 1 }
        queued_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        verdict: { type: [string, 'null'] }
        score: { type: [string, 'null'], description: Null until judged. }
        maximum_score: { type: string }
        passed_units: { type: [integer, 'null'] }
        total_units: { type: [integer, 'null'] }
        verdict_counts:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: Number of tests per verdict, for example {"accepted":3,"wrong_answer":1}.
    Paper:
      type: object
      additionalProperties: false
      required: [attempt_id, exam_id, title, instructions_markdown, items]
      properties:
        attempt_id: { $ref: '#/components/schemas/UUID' }
        exam_id: { $ref: '#/components/schemas/UUID' }
        title: { type: string }
        instructions_markdown: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [exam_item_id, position, title, prompt_markdown, maximum_score, supported_languages, time_limit_ms, memory_limit_kib, latest_answer]
            properties:
              exam_item_id: { $ref: '#/components/schemas/UUID' }
              position: { type: integer, minimum: 1 }
              title: { type: string }
              prompt_markdown: { type: string }
              maximum_score: { type: string }
              supported_languages: { type: array, items: { type: string } }
              time_limit_ms: { type: integer, minimum: 0 }
              memory_limit_kib: { type: integer, minimum: 0 }
              latest_answer:
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required: [language, source, revision_number]
                    properties:
                      language: { type: string }
                      source: { type: string }
                      revision_number: { type: integer, minimum: 1 }
    CodeRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CodeRun'
        next_cursor:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Problem400:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem403:
      description: Authorization denied or local authorization projection is stale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem404:
      description: Candidate-owned record was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem409:
      description: State, deadline, idempotency, or optimistic-version conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem503:
      description: Candidate source storage or key management is not configured or reachable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
