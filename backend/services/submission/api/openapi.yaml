        attempt_id: {$ref: '#/components/schemas/UUID'}
        exam_item_id: {$ref: '#/components/schemas/UUID'}
        revision_number: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        language_id: {type: string, maxLength: 1000}
        created_at: {type: string, format: date-time, maxLength: 35}
        created_by: {$ref: '#/components/schemas/UUID'}
        attempt_version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
    AttemptPage:
      type: object
      additionalProperties: false
