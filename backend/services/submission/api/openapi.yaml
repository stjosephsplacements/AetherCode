      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
          maxItems: 200
        next_cursor:
          type: string
          maxLength: 1000
    AnswerRevisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnswerRevision'
          maxItems: 200
        next_cursor:
          type: string
          maxLength: 1000
    CodeRun:
      type: object
      additionalProperties: false
      required: [id, attempt_id, exam_item_id, language_id, lifecycle_state, verdict, created_at, completed_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        attempt_id: {$ref: '#/components/schemas/UUID'}
        exam_item_id: {$ref: '#/components/schemas/UUID'}
        language_id: {type: string, maxLength: 1000}
        lifecycle_state: {type: string, enum: [queued, dispatched, completed, failed, cancelled]}
        verdict: {type: [string, 'null'], maxLength: 1000}
        passed_units: {type: integer, minimum: 0, description: Listed runs only., format: int64, maximum: 2147483647}
        total_units: {type: integer, minimum: 0, description: Listed runs only., format: int64, maximum: 2147483647}
        created_at: {type: string, format: date-time, maxLength: 35}
        completed_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        units:
          type: array
          description: A fetched run only. Sample tests are not confidential, so nothing is redacted.
          items:
            type: object
            additionalProperties: false
            required: [unit_number, verdict]
            properties:
              unit_number: {type: integer, minimum: 0, format: int64, maximum: 2147483647}
              verdict: {type: string, maxLength: 1000}
              stdin: {type: [string, 'null'], maxLength: 1000}
              expected_output: {type: [string, 'null'], maxLength: 1000}
              stdout: {type: [string, 'null'], maxLength: 1000}
              stderr: {type: [string, 'null'], maxLength: 1000}
              compile_output: {type: [string, 'null'], maxLength: 1000}
              execution_time_ms: {type: [integer, 'null'], format: int64, maximum: 2147483647, minimum: 0}
              memory_kib: {type: [integer, 'null'], format: int64, maximum: 2147483647, minimum: 0}
          maxItems: 200
    ItemSubmission:
      type: object
