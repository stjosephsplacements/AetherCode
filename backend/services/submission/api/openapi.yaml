components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC8725. Include as: Authorization: Bearer <token>.'
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    AttemptID:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ExamVersionID:
      name: exam_version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ExamItemID:
      name: exam_item_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    Announcement:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        body: {type: string, maxLength: 1000}
        created_at: {type: string, format: date-time, maxLength: 35}
    UUID:
      type: string
      format: uuid
      maxLength: 36
    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      maxLength: 1000
    Attempt:
      type: object
      additionalProperties: false
      required:
      - id
      - tenant_id
      - exam_id
      - exam_version_id
      - candidate_id
      - candidate_assignment_id
      - attempt_number
      - lifecycle_state
      - available_from
      - submission_deadline
      - version
      - created_at
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        exam_id: {$ref: '#/components/schemas/UUID'}
        exam_version_id: {$ref: '#/components/schemas/UUID'}
        candidate_id: {$ref: '#/components/schemas/UUID'}
        candidate_assignment_id: {$ref: '#/components/schemas/UUID'}
        attempt_number: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        lifecycle_state:
          type: string
          enum: [created, active, submitted, grading, graded, expired, cancelled]
        available_from: {type: string, format: date-time, maxLength: 35}
        submission_deadline: {type: string, format: date-time, maxLength: 35}
        started_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        submitted_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        completed_at: {type: [string, 'null'], format: date-time, maxLength: 35}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {type: string, format: date-time, maxLength: 35}
    AnswerRevision:
      type: object
      additionalProperties: false
      required:
      - id
      - tenant_id
      - attempt_id
      - exam_item_id
      - revision_number
      - language_id
      - created_at
      - created_by
      - attempt_version
      properties:
        id: {$ref: '#/components/schemas/UUID'}
