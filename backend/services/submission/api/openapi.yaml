            properties:
              exam_item_id: {$ref: '#/components/schemas/UUID'}
              position: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
              title: {type: string, maxLength: 1000}
              prompt_markdown: {type: string, maxLength: 1000}
              maximum_score: {type: string, maxLength: 1000}
              supported_languages: {type: array, items: {type: string, maxLength: 1000}, maxItems: 200}
              time_limit_ms: {type: integer, minimum: 0, format: int64, maximum: 2147483647}
              memory_limit_kib: {type: integer, minimum: 0, format: int64, maximum: 2147483647}
              latest_answer:
                oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required: [language, source, revision_number]
                  properties:
                    language: {type: string, maxLength: 1000}
                    source: {type: string, maxLength: 1000}
                    revision_number: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
          maxItems: 200
    CodeRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CodeRun'
          maxItems: 200
        next_cursor:
          type: string
          maxLength: 1000
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
  responses:
    Problem400:
      description: Invalid request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem403:
      description: Authorization denied or local authorization projection is stale.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem404:
      description: Candidate-owned record was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem409:
      description: State, deadline, idempotency, or optimistic-version conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem503:
      description: Candidate source storage or key management is not configured or reachable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem401:
      description: Unauthorized — missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem500:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem429:
      description: Too many requests — rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 86400
servers:
- url: https://submission.internal.aethercode.in
  description: AetherCode submission service — internal platform endpoint (production)
  x-internal: true
