components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: AetherCode access token, description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC8725. Include as: Authorization: Bearer <token>.'}
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A stable request key. Reusing it with different JSON bytes returns
        conflict; successful responses are replayed for 24 hours.
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    Operational:
      description: Operational status
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Preference:
      description: Caller-owned preference
      content:
        application/json: {schema: {$ref: '#/components/schemas/Preference'}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Notification:
      description: Notification metadata and encrypted payload reference
      content:
        application/json: {schema: {$ref: '#/components/schemas/Notification'}}
      headers:
