openapi: 3.1.1
info:
  title: AetherCode Notification API
  version: 1.0.0
  description: >-
    Tenant-scoped notification preferences, encrypted notification references,
    and durable in-app delivery. Every business request receives a fresh
    central authorization decision and a one-transaction local RLS capability.
servers:
- url: https://notification.internal.aethercode
  description: AetherCode notification service — internal platform endpoint (production)
  x-internal: true
paths:
  /healthz:
    get:
      responses:
        '200': {$ref: '#/components/responses/Operational'}
        '500':
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      responses:
        '200': {$ref: '#/components/responses/Operational'}
        '503': {$ref: '#/components/responses/Operational'}
        '500':
          $ref: '#/components/responses/Problem500'
  /v1/tenants/{tenant_id}/me/preferences:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      security: [bearerAuth: []]
      summary: List the caller's notification preferences
      responses:
        '200':
          description: Caller-owned preferences
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Preference'}
                    maxItems: 200
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/me/preferences/in-app:
    parameters: [$ref: '#/components/parameters/TenantID']
    put:
      security: [bearerAuth: []]
      summary: Create or optimistically update the caller's in-app preference
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferenceWrite'}
      responses:
        '200': {$ref: '#/components/responses/Preference'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/me/preferences/email:
    parameters: [$ref: '#/components/parameters/TenantID']
    put:
      security: [bearerAuth: []]
      summary: Create or optimistically update the caller's email preference
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferenceWrite'}
      responses:
        '200': {$ref: '#/components/responses/Preference'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/me/preferences/sms:
    parameters: [$ref: '#/components/parameters/TenantID']
    put:
      security: [bearerAuth: []]
      summary: Create or optimistically update the caller's SMS preference
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferenceWrite'}
      responses:
        '200': {$ref: '#/components/responses/Preference'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/me/notifications:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      security: [bearerAuth: []]
      summary: List the caller's encrypted notification references
      parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50, format: int64}
      responses:
        '200':
          description: Caller-owned notification metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Notification'}
                    maxItems: 200
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/notifications:
    parameters: [$ref: '#/components/parameters/TenantID']
    post:
      security: [bearerAuth: []]
      summary: Schedule one encrypted notification for a recipient
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleNotification'}
      responses:
        '201': {$ref: '#/components/responses/Notification'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/notifications/{notification_id}/cancel:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/NotificationID'}
    post:
      security: [bearerAuth: []]
      summary: Cancel a pending notification with optimistic concurrency
      parameters: [$ref: '#/components/parameters/IdempotencyKey']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelNotification'}
      responses:
        '200': {$ref: '#/components/responses/Notification'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/notifications/{notification_id}:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/NotificationID'}
    delete:
      security: [bearerAuth: []]
      summary: Soft-delete a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Notification soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/notifications/{notification_id}/hard:
    parameters:
    - {$ref: '#/components/parameters/TenantID'}
    - {$ref: '#/components/parameters/NotificationID'}
    delete:
      security: [bearerAuth: []]
      summary: Permanently delete a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
