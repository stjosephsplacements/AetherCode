  schemas:
    UUID: {type: string, format: uuid, maxLength: 36}
    SHA256: {type: string, pattern: '^[0-9a-f]{64}$', maxLength: 1000}
    PreferenceWrite:
      type: object
      required: [enabled, expected_version]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        expected_version: {type: integer, minimum: 0, format: int64, maximum: 2147483647}
    Preference:
      type: object
      required: [id, tenant_id, recipient_id, channel, enabled, updated_at, version]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        recipient_id: {$ref: '#/components/schemas/UUID'}
        channel: {type: string, const: in_app}
        enabled: {type: boolean}
        updated_at: {type: string, format: date-time, maxLength: 35}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
    ScheduleNotification:
      type: object
      required:
      - recipient_id
      - category
      - template_code
      - content_object_key
      - content_checksum
      - encryption_key_reference
      - scheduled_at
      additionalProperties: false
      properties:
        recipient_id: {$ref: '#/components/schemas/UUID'}
        category: {type: string, enum: [exam_reminder, exam_result, system]}
        template_code: {type: string, minLength: 1, maxLength: 160}
        content_object_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Encrypted object-storage reference; never plaintext content.
        content_checksum: {$ref: '#/components/schemas/SHA256'}
        encryption_key_reference: {type: string, minLength: 1, maxLength: 255}
        scheduled_at: {type: string, format: date-time, maxLength: 35}
        retention_subject_id:
          description: Optional Assessment or Submission aggregate covered by a legal hold.
          allOf: [$ref: '#/components/schemas/UUID']
    CancelNotification:
      type: object
      required: [expected_version, reason]
      additionalProperties: false
      properties:
        expected_version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        reason: {type: string, minLength: 1, maxLength: 500}
    Notification:
      type: object
      required:
      - id
      - tenant_id
      - recipient_id
      - category
      - template_code
      - content_object_key
      - content_checksum
      - encryption_key_reference
      - lifecycle_state
      - scheduled_at
      - created_at
      - retention_until
      - legal_hold
      - version
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        recipient_id: {$ref: '#/components/schemas/UUID'}
        category: {type: string, enum: [exam_reminder, exam_result, system]}
        template_code: {type: string, maxLength: 1000}
        content_object_key: {type: string, maxLength: 1000}
        content_checksum: {$ref: '#/components/schemas/SHA256'}
        encryption_key_reference: {type: string, maxLength: 1000}
        lifecycle_state: {type: string, enum: [pending, sending, sent, partially_delivered, failed, cancelled]}
        scheduled_at: {type: string, format: date-time, maxLength: 35}
        created_at: {type: string, format: date-time, maxLength: 35}
        completed_at: {type: string, format: date-time, maxLength: 35}
        retention_until: {type: string, format: date-time, maxLength: 35}
        legal_hold: {type: boolean}
        retention_subject_id: {$ref: '#/components/schemas/UUID'}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 86400
