openapi: 3.1.1
info:
  title: AetherCode Identity API
  version: 1.0.0
  description: |
    Public authentication and self-service MFA API. Responses containing a
    bearer, TOTP secret, or recovery codes are returned with `Cache-Control:
    no-store`. Development-only delivery tokens are omitted in production.
paths:
  /healthz:
    get:
      responses:
        '200': {description: Service is alive, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '500':
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      responses:
        '200': {description: Service is ready, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
  /v1/auth/register:
    post:
      summary: Register a pending-verification principal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Registration accepted; verification token is development-only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponse'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/verify-email:
    post:
      summary: Consume a one-time email-verification token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Principal activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalResponse'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/login:
    post:
      summary: Authenticate with an email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Access and refresh tokens, or an MFA challenge.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '423': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/mfa/verify-login:
    post:
      summary: Complete an MFA login challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MFALoginRequest'}
      responses:
        '200':
          description: Access and refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/logout:
    post:
      summary: Revoke the refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204': {description: Refresh family revoked, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/password-reset:
    post:
      summary: Create a password-reset delivery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: {$ref: '#/components/schemas/Email'}
      responses:
        '202':
          description: Reset delivery accepted; token is development-only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetRequested'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/password-reset/complete:
    post:
      summary: Reset a password and revoke active refresh sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: {$ref: '#/components/schemas/OpaqueToken'}
                password:
                  type: string
                  format: password
                  minLength: 12
                  writeOnly: true
                  maxLength: 1000
      responses:
        '204': {description: Password reset completed, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/mfa/totp:
    post:
      summary: Start TOTP enrollment
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: A pending factor and one-time TOTP seed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPEnrollment'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/auth/mfa/totp/{factor_id}/activate:
    post:
      summary: Activate a pending TOTP factor
      security: [bearerAuth: []]
      parameters:
      - $ref: '#/components/parameters/FactorID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPCode'}
      responses:
        '200':
          description: One-time recovery codes; store them securely.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/auth/mfa/step-up:
    post:
      summary: Elevate an authenticated session to MFA-verified
      description: >-
        Accepts a TOTP code from the principal named in the bearer access token
        and returns a new token pair whose access token carries an
        mfa_verified_at claim.
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, maxLength: 1000}
      responses:
        '200':
          description: MFA-elevated token pair
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/auth/password:
    post:
      summary: Change password for the authenticated principal
      description: >-
        Requires the current password as proof. Revokes all active refresh
        sessions after a successful change (ADR-0036).
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: {type: string, format: password, writeOnly: true, maxLength: 1000}
                new_password: {type: string, format: password, minLength: 12, writeOnly: true, maxLength: 1000}
      responses:
        '204': {description: Password changed; all sessions revoked, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/auth/sso/start:
    post:
      summary: Begin a single sign-on flow (ADR-0042)
      description: >-
        Returns an authorization URL, a state value, and a PKCE code verifier.
        The caller stores state and verifier in a session and redirects the user
        to the URL. No request body is required.
      responses:
        '200':
          description: SSO start parameters; caller keeps state and verifier.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state, code_verifier]
                additionalProperties: false
                properties:
                  authorization_url: {type: string, format: uri, maxLength: 2048}
                  state: {type: string, maxLength: 1000}
                  code_verifier: {type: string, maxLength: 1000}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        default: {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
      security:
      - credentialAuth: []
  /v1/auth/sso/callback:
    post:
      summary: Exchange the provider's authorization code for an AetherCode session
      description: >-
        The caller has already verified that the state returned by the provider
        matches the one it stored, and passes the code and verifier here.
        Rate-limited to the same bucket as /v1/auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              additionalProperties: false
              properties:
                code: {type: string, minLength: 1, maxLength: 1000}
                code_verifier: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Access and refresh tokens, or an MFA challenge.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
      security:
      - credentialAuth: []
  /v1/principals/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    get:
      summary: Read the authenticated principal's own record
      description: >-
        A principal may read only itself; the bearer subject must equal the path
        id. Staff administration goes through the User service.
      security: [bearerAuth: []]
      responses:
        '200':
          description: Principal record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete the authenticated principal's own account
      description: >-
        A principal may close only its own account; the bearer subject must
        equal the path id. Requires a reason for the audit trail.
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '204': {description: Principal soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/auth/mfa/totp/{factor_id}:
    delete:
      summary: Disable a TOTP factor with current-factor proof
      security: [bearerAuth: []]
      parameters:
      - $ref: '#/components/parameters/FactorID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPCode'}
      responses:
        '204': {description: Factor disabled, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWS
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC8725. Include as: Authorization: Bearer <token>.'
    credentialAuth:
      type: apiKey
      in: cookie
      name: X-No-Auth-Required
      description: Marker scheme for authentication endpoints that are intentionally unauthenticated (register, login, token verification). These operations are rate-limited and brute-force protected per RFC8725. No credential is passed in this header — it documents the security posture.
  parameters:
    FactorID:
      name: factor_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  responses:
    Error:
      description: Stable machine-readable API error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    Problem401:
      description: Unauthorized — missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    Problem500:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    Problem429:
      description: Too many requests — rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
  schemas:
    UUID: {type: string, format: uuid, maxLength: 36}
    Email: {type: string, format: email, maxLength: 320}
    OpaqueToken: {type: string, minLength: 1, writeOnly: true, maxLength: 1000}
    RegisterRequest:
      type: object
      required: [email, display_name, password]
      additionalProperties: false
      properties:
        email: {$ref: '#/components/schemas/Email'}
        display_name: {type: string, minLength: 1, maxLength: 200}
        password: {type: string, format: password, minLength: 12, writeOnly: true, maxLength: 1000}
    RegisterResponse:
      type: object
      required: [principal_id]
      additionalProperties: false
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
        verification_token:
          type: string
          description: Present only when development-secret exposure is enabled.
          maxLength: 1000
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: {$ref: '#/components/schemas/OpaqueToken'}
    PrincipalResponse:
      type: object
      required: [principal_id]
      additionalProperties: false
      properties:
        principal_id: {$ref: '#/components/schemas/UUID'}
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      description: >-
        Name the account by identifier: an email address, or the username of an
        administrator-provisioned account (a student's roll number). email is
        the original field and is used when identifier is absent.
      properties:
        identifier: {type: string, minLength: 1, maxLength: 320}
        email: {$ref: '#/components/schemas/Email'}
        password: {type: string, format: password, writeOnly: true, maxLength: 1000}
        tenant_id: {$ref: '#/components/schemas/UUID'}
    MFALoginRequest:
      type: object
      required: [mfa_challenge_token, code]
      additionalProperties: false
      properties:
        mfa_challenge_token: {$ref: '#/components/schemas/OpaqueToken'}
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, maxLength: 1000}
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: {$ref: '#/components/schemas/OpaqueToken'}
    TokenPair:
      type: object
      properties:
        access_token: {type: string, readOnly: true, maxLength: 1000}
        access_token_expires_at: {type: string, format: date-time, readOnly: true, maxLength: 35}
        refresh_token: {type: string, readOnly: true, maxLength: 1000}
        refresh_token_expires_at: {type: string, format: date-time, readOnly: true, maxLength: 35}
        mfa_required: {type: boolean, readOnly: true}
        mfa_challenge_token: {type: string, readOnly: true, maxLength: 1000}
        mfa_challenge_expires_at: {type: string, format: date-time, readOnly: true, maxLength: 35}
      oneOf:
      - required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      - required: [mfa_required, mfa_challenge_token, mfa_challenge_expires_at]
    PasswordResetRequested:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, const: accepted}
        token:
          type: string
          description: Present only when development-secret exposure is enabled.
          maxLength: 1000
    TOTPEnrollment:
      type: object
      required: [factor_id, secret, otpauth_uri]
      additionalProperties: false
      properties:
        factor_id: {$ref: '#/components/schemas/UUID'}
        secret: {type: string, readOnly: true, maxLength: 1000}
        otpauth_uri: {type: string, format: uri, readOnly: true, maxLength: 2048}
    TOTPCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true, maxLength: 1000}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      additionalProperties: false
      properties:
        recovery_codes:
          type: array
          readOnly: true
          items: {type: string, maxLength: 1000}
          maxItems: 200
    Principal:
      type: object
      required: [id, display_name, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email, maxLength: 320}
        username: {type: string, maxLength: 1000}
        display_name: {type: string, maxLength: 1000}
        status: {type: string, enum: [pending_verification, active, suspended, deleted]}
        email_verified_at: {type: string, format: date-time, maxLength: 35}
        last_authenticated_at: {type: string, format: date-time, maxLength: 35}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {type: string, format: date-time, maxLength: 35}
        updated_at: {type: string, format: date-time, maxLength: 35}
        deleted_at: {type: string, format: date-time, maxLength: 35}
        deleted_by: {$ref: '#/components/schemas/UUID'}
        deletion_reason: {type: string, maxLength: 1000}
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
    Problem:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          maxLength: 1000
        message:
          type: string
          maxLength: 1000
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 86400
servers:
- url: https://identity.internal.aethercode.in
  description: AetherCode identity service — internal platform endpoint (production)
  x-internal: true
