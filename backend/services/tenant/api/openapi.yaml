openapi: 3.1.1
info:
  title: AetherCode Tenant API
  version: 1.0.0
  description: |
    Tenant, department, batch, retention, and legal-hold workflows. Every
    business request requires an Identity bearer assertion, a fresh User
    authorization decision over mTLS, and a transaction-scoped signed RLS
    capability; authorization failures fail closed.
paths:
  /healthz:
    get:
      responses:
        '200': {description: Service is alive, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '500':
          $ref: '#/components/responses/Problem500'
  /readyz:
    get:
      responses:
        '200': {description: Service is ready, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '503': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
  /v1/tenants:
    get:
      summary: List all tenants (global resource, Class B)
      security: [bearerAuth: []]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string, enum: [provisioning, active, suspended, closed]}
      responses:
        '200': {$ref: '#/components/responses/TenantPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Provision a college tenant
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionTenantRequest'}
      responses:
        '201': {$ref: '#/components/responses/Tenant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}:
    parameters: [$ref: '#/components/parameters/TenantID']
    get:
      summary: Read a tenant
      security: [bearerAuth: []]
      responses:
        '200': {$ref: '#/components/responses/Tenant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    patch:
      summary: Rename a college; only the fields sent change
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_name: {type: string, maxLength: 1000}
                display_name: {type: string, maxLength: 1000}
      responses:
        '200': {description: The updated tenant, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '401':
          $ref: '#/components/responses/Problem401'
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    delete:
      summary: Soft-delete a tenant
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteEntityRequest'}
      responses:
        '204': {description: Tenant soft-deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/hard:
    parameters: [$ref: '#/components/parameters/TenantID']
    delete:
      summary: Permanently delete a tenant
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteEntityRequest'}
      responses:
        '204': {description: Tenant permanently deleted, headers: {RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}, RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}, RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}, Access-Control-Allow-Origin: {$ref: '#/components/headers/Access-Control-Allow-Origin'}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/placement-organizations:
    get:
      summary: List placement organizations (global resource, Class B)
      security: [bearerAuth: []]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string, enum: [active, suspended, closed]}
      responses:
        '200': {$ref: '#/components/responses/PlacementOrganizationPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create a placement organization
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlacementOrganizationRequest'}
      responses:
        '201': {$ref: '#/components/responses/PlacementOrganization'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/departments:
    get:
      summary: List college departments for a tenant (Class B)
      security: [bearerAuth: []]
      parameters:
      - {$ref: '#/components/parameters/TenantID'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string, enum: [active, archived]}
      responses:
        '200': {$ref: '#/components/responses/DepartmentPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create a college department
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/TenantID']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentRequest'}
      responses:
        '201': {$ref: '#/components/responses/Department'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/placement-organizations/{organization_id}/departments:
    get:
      summary: List placement departments for an organization (Class B, global)
      security: [bearerAuth: []]
      parameters:
      - {$ref: '#/components/parameters/OrganizationID'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: status
        in: query
        schema: {type: string, enum: [active, archived]}
      responses:
        '200': {$ref: '#/components/responses/DepartmentPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create a placement department
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/OrganizationID']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DepartmentRequest'}
      responses:
