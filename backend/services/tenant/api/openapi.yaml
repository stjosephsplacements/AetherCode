          $ref: '#/components/responses/Problem429'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWS
      description: 'Bearer JSON Web Token (JWT). Tokens are short-lived and signed per RFC8725. Include as: Authorization: Bearer <token>.'
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    HoldID:
      name: hold_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int64}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 1000}
  responses:
    Tenant:
      description: Tenant record
      content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    TenantPage:
      description: Keyset page of tenants
      content: {application/json: {schema: {$ref: '#/components/schemas/TenantPage'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    PlacementOrganization:
      description: Placement organization record
      content: {application/json: {schema: {$ref: '#/components/schemas/PlacementOrganization'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    PlacementOrganizationPage:
      description: Keyset page of placement organizations
      content: {application/json: {schema: {$ref: '#/components/schemas/PlacementOrganizationPage'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Department:
      description: Department record
      content: {application/json: {schema: {$ref: '#/components/schemas/Department'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    DepartmentPage:
      description: Keyset page of departments
      content: {application/json: {schema: {$ref: '#/components/schemas/DepartmentPage'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Batch:
      description: Batch record
      content: {application/json: {schema: {$ref: '#/components/schemas/Batch'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    BatchPage:
      description: Keyset page of batches
      content: {application/json: {schema: {$ref: '#/components/schemas/BatchPage'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    RetentionPolicy:
      description: Tenant retention policy
      content: {application/json: {schema: {$ref: '#/components/schemas/RetentionPolicy'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    LegalHold:
      description: Legal hold record
      content: {application/json: {schema: {$ref: '#/components/schemas/LegalHold'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Error:
      description: Stable machine-readable API error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem401:
      description: Unauthorized — missing, expired, or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem500:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
    Problem429:
      description: Too many requests — rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
  schemas:
    UUID: {type: string, format: uuid, maxLength: 36}
    Timestamp: {type: string, format: date-time, maxLength: 35}
    DeleteEntityRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    PlacementOrganizationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlacementOrganization'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    TenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Tenant'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    DepartmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Department'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    BatchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
          maxItems: 200
        next_cursor: {type: string, maxLength: 1000}
    ProvisionTenantRequest:
      type: object
      required: [slug, legal_name, display_name]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', maxLength: 1000}
        legal_name: {type: string, minLength: 1, maxLength: 255}
        display_name: {type: string, minLength: 1, maxLength: 255}
    PlacementOrganizationRequest:
      type: object
      required: [code, legal_name]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9-]{1,62}$', maxLength: 1000}
        legal_name: {type: string, minLength: 1, maxLength: 255}
    DepartmentRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{1,62}$', maxLength: 1000}
        name: {type: string, minLength: 1, maxLength: 255}
    BatchRequest:
      type: object
      required: [department_id, code, name, academic_year]
      additionalProperties: false
      properties:
        department_id: {$ref: '#/components/schemas/UUID'}
        code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{1,62}$', maxLength: 1000}
        name: {type: string, minLength: 1, maxLength: 255}
        academic_year: {type: string, pattern: '^[0-9]{4}-[0-9]{4}$', maxLength: 1000}
    RetentionPolicyRequest:
      type: object
      required: [academic_records_years, audit_records_years, auth_logs_days, notification_delivery_days, execution_record_days]
      additionalProperties: false
      properties:
        academic_records_years: {type: integer, minimum: 7, maximum: 30, format: int64}
        audit_records_years: {type: integer, minimum: 7, maximum: 30, format: int64}
        auth_logs_days: {type: integer, minimum: 90, maximum: 3650, format: int64}
        notification_delivery_days: {type: integer, minimum: 30, maximum: 3650, format: int64}
        execution_record_days: {type: integer, minimum: 1, maximum: 365, format: int64}
    LegalHoldRequest:
      type: object
      required: [scope, reason]
      additionalProperties: false
      properties:
        scope: {type: string, enum: [tenant, student, assessment, submission]}
        subject_id:
          oneOf:
          - {$ref: '#/components/schemas/UUID'}
          - {type: 'null'}
        reason: {type: string, minLength: 1, maxLength: 2000}
    Tenant:
      type: object
      required: [id, slug, legal_name, display_name, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        slug: {type: string, maxLength: 1000}
        legal_name: {type: string, maxLength: 1000}
        display_name: {type: string, maxLength: 1000}
        status: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    PlacementOrganization:
      type: object
      required: [id, code, legal_name, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        code: {type: string, maxLength: 1000}
        legal_name: {type: string, maxLength: 1000}
        status: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    Department:
      type: object
      required: [id, department_type, code, name, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        placement_organization_id: {$ref: '#/components/schemas/UUID'}
        department_type: {type: string, enum: [college, placement]}
        code: {type: string, maxLength: 1000}
        name: {type: string, maxLength: 1000}
        status: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    Batch:
      type: object
      required: [id, tenant_id, department_id, code, name, academic_year, status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        department_id: {$ref: '#/components/schemas/UUID'}
        code: {type: string, maxLength: 1000}
        name: {type: string, maxLength: 1000}
        academic_year: {type: string, maxLength: 1000}
        status: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    RetentionPolicy:
      allOf:
      - {$ref: '#/components/schemas/RetentionPolicyRequest'}
      - type: object
        required: [tenant_id, version, updated_at]
        properties:
          tenant_id: {$ref: '#/components/schemas/UUID'}
          version: {type: integer, minimum: 1, format: int64, maximum: 2147483647}
          updated_at: {$ref: '#/components/schemas/Timestamp'}
    LegalHold:
      type: object
      required: [id, tenant_id, scope, reason, status, placed_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        tenant_id: {$ref: '#/components/schemas/UUID'}
        scope: {type: string, enum: [tenant, student, assessment, submission]}
        subject_id: {$ref: '#/components/schemas/UUID'}
        reason: {type: string, maxLength: 1000}
        status: {type: string, enum: [active, released]}
        placed_at: {$ref: '#/components/schemas/Timestamp'}
        released_at: {$ref: '#/components/schemas/Timestamp'}
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: {type: string, maxLength: 1000}
        message: {type: string, maxLength: 1000}
    Problem:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          maxLength: 1000
        message:
          type: string
          maxLength: 1000
  headers:
    RateLimit-Limit:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Remaining:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    RateLimit-Reset:
      description: Standard rate-limit response headers (RFC 6585 / IETF draft-ietf-httpapi-ratelimit-headers).
      schema:
        type: string
        maxLength: 64
    Access-Control-Allow-Origin:
      description: CORS allowed origins. The platform gateway sets this; internal services declare it for contract completeness.
      schema:
        type: string
        maxLength: 256
    Retry-After:
      description: Number of seconds to wait before retrying after a 429 rate-limit response.
      schema:
        type: integer
        minimum: 0
        format: int32
        maximum: 86400
servers:
- url: https://tenant.internal.aethercode.in
  description: AetherCode tenant service — internal platform endpoint (production)
  x-internal: true
