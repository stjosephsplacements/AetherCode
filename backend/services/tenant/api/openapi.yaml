        in: query
        schema: {type: string, enum: [active, archived]}
      - name: department_id
        in: query
        schema: {$ref: '#/components/schemas/UUID'}
      - name: academic_year
        in: query
        schema: {type: string, pattern: '^[0-9]{4}-[0-9]{4}$', maxLength: 1000}
      responses:
        '200': {$ref: '#/components/responses/BatchPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
    post:
      summary: Create a batch in an active college department
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/TenantID']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '201': {$ref: '#/components/responses/Batch'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/retention-policy:
    put:
      summary: Set tenant retention policy within platform bounds
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/TenantID']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionPolicyRequest'}
      responses:
        '200': {$ref: '#/components/responses/RetentionPolicy'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/legal-holds:
    post:
      summary: Place a tenant, student, assessment, or submission legal hold
      security: [bearerAuth: []]
      parameters: [$ref: '#/components/parameters/TenantID']
