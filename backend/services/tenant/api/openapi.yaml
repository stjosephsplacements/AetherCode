    patch:
      summary: Rename a placement organisation
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legal_name: {type: string, maxLength: 1000}
      responses:
