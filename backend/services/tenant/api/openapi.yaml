        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/tenants/{tenant_id}/legal-holds/{hold_id}/release:
    post:
      summary: Release an active legal hold
      security: [bearerAuth: []]
      parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/HoldID'
      responses:
        '200': {$ref: '#/components/responses/LegalHold'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
          $ref: '#/components/responses/Problem429'
  /v1/placement-organizations/{organization_id}:
    parameters:
    - {name: organization_id, in: path, required: true, schema: {type: string, format: uuid, maxLength: 36}}
    get:
      summary: Read a placement organization
      security: [bearerAuth: []]
      responses:
        '200': {$ref: '#/components/responses/PlacementOrganization'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500':
          $ref: '#/components/responses/Problem500'
        '429':
