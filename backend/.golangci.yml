version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - linters: [govet]
        text: "shadow: declaration of \"err\" shadows"

formatters:
  enable:
    - gofmt
