# Front door for the exam app when a host reverse proxy (the campus server's
# nginx behind Cloudflare) terminates TLS and reaches this container through
# the Docker bridge. It takes the client address from that proxy's
# X-Forwarded-For and then, exactly like nginx.conf, overwrites the header
# with it, which is what the per-exam network allow-list trusts. Publish this
# container on loopback only (APP_PORT=127.0.0.1:<port>), so nothing else can
# reach it and set the header.
server {
    listen 80;
    client_max_body_size 25m;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Resolve "app" per request through Docker's DNS: a recreated app container
    # gets a new IP, and a name resolved once at startup would then return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:3000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
