# Front door for the exam app when a host reverse proxy terminates TLS.
# Docker DNS round-robins across all app replicas when using variables.
# Publish on loopback only (APP_PORT=127.0.0.1:<port>).

server {
    listen 80;
    client_max_body_size 25m;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app http://app:3000;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    location ~ ^/api/submissions/[^/]+/stream$ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_read_timeout 360s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        chunked_transfer_encoding on;
    }

    location /api/submissions/ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
