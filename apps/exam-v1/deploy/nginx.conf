# Front door for the exam app. It overwrites X-Forwarded-For with the real
# connection address, which is what the per-exam network allow-list trusts.
server {
    listen 80;
    client_max_body_size 25m;

    # Resolve "app" per request through Docker's DNS: a recreated app container
    # gets a new IP, and a name resolved once at startup would then return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:3000;

    location ~ ^/api/submissions/[^/]+/stream$ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 360s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        chunked_transfer_encoding on;
    }

    location /api/submissions/ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
