# Single-server deployment: app + grading worker + Postgres.
# Usage: see ../README.md "Deploying on the campus server".
name: aethercode-exam

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: exam
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  migrate:
    build: ..
    command: ["pnpm", "migrate"]
    environment: &app-env
      DATABASE_URL: postgres://exam:${DB_PASSWORD}@db:5432/exam
      ENGINE: ${ENGINE:-aethercode}
      ENGINE_URL: ${ENGINE_URL:-http://172.17.0.1:5100}
      ENGINE_AUTH_TOKEN: ${ENGINE_AUTH_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Public origin students use; SEB links and SEB checks are built from it.
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ..
    restart: always
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The only published port. Do not expose `app` directly: the network
  # allow-list relies on nginx overwriting X-Forwarded-For.
  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # nginx.behind-proxy.conf when a host proxy terminates TLS (README).
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  worker:
    build: ..
    restart: always
    command: ["pnpm", "worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-alpine
    restart: always
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
