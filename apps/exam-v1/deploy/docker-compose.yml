# Single-server deployment: app + grading worker + Postgres.
# Usage: see ../README.md "Deploying on the campus server".
name: aethercode-exam

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: exam
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "checkpoint_completion_target=0.9"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      retries: 10

  migrate:
    build: ..
    command: ["pnpm", "migrate"]
    environment: &app-env
      DATABASE_URL: postgres://exam:${DB_PASSWORD}@db:5432/exam
      ENGINE: ${ENGINE:-aethercode}
      ENGINE_URL: ${ENGINE_URL:-http://172.17.0.1:5100}
      ENGINE_AUTH_TOKEN: ${ENGINE_AUTH_TOKEN:-}
      ENGINE_BATCH: ${ENGINE_BATCH:-}
      # Judge0 tuning (all optional — see .env.example for defaults)
      ENGINE_JUDGE0_POLL_INTERVAL_MS: ${ENGINE_JUDGE0_POLL_INTERVAL_MS:-}
      ENGINE_JUDGE0_POLL_DEADLINE_MS: ${ENGINE_JUDGE0_POLL_DEADLINE_MS:-}
      ENGINE_JUDGE0_BATCH_CPU_BUDGET_SECONDS: ${ENGINE_JUDGE0_BATCH_CPU_BUDGET_SECONDS:-}
      ENGINE_JUDGE0_BATCH_WALL_BUDGET_SECONDS: ${ENGINE_JUDGE0_BATCH_WALL_BUDGET_SECONDS:-}
      ENGINE_JUDGE0_MAX_CPU_SECONDS: ${ENGINE_JUDGE0_MAX_CPU_SECONDS:-}
      ENGINE_JUDGE0_MAX_MEMORY_KB: ${ENGINE_JUDGE0_MAX_MEMORY_KB:-}
      # AetherCode engine tuning (all optional — see .env.example for defaults)
      ENGINE_AC_STREAM_TIMEOUT_MS: ${ENGINE_AC_STREAM_TIMEOUT_MS:-}
      ENGINE_AC_MAX_TIME_LIMIT_MS: ${ENGINE_AC_MAX_TIME_LIMIT_MS:-}
      ENGINE_AC_MIN_TIME_LIMIT_MS: ${ENGINE_AC_MIN_TIME_LIMIT_MS:-}
      ENGINE_AC_MAX_MEMORY_LIMIT_KB: ${ENGINE_AC_MAX_MEMORY_LIMIT_KB:-}
      ENGINE_AC_MIN_MEMORY_LIMIT_KB: ${ENGINE_AC_MIN_MEMORY_LIMIT_KB:-}
      ENGINE_AC_RETRY_INITIAL_DELAY_MS: ${ENGINE_AC_RETRY_INITIAL_DELAY_MS:-}
      ENGINE_AC_RETRY_MAX_DELAY_MS: ${ENGINE_AC_RETRY_MAX_DELAY_MS:-}
      # Worker tuning (all optional — see .env.example for defaults)
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      WORKER_MAX_IN_FLIGHT: ${WORKER_MAX_IN_FLIGHT:-}
      WORKER_MAX_TRIES: ${WORKER_MAX_TRIES:-}
      WORKER_IDLE_POLL_MS: ${WORKER_IDLE_POLL_MS:-}
      WORKER_OUTPUT_LIMIT_BYTES: ${WORKER_OUTPUT_LIMIT_BYTES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Public origin students use; SEB links and SEB checks are built from it.
      APP_URL: ${APP_URL:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ..
    restart: always
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The only published port. Do not expose `app` directly: the network
  # allow-list relies on nginx overwriting X-Forwarded-For.
  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # nginx.behind-proxy.conf when a host proxy terminates TLS (README).
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  worker:
    build: ..
    restart: always
    command: ["pnpm", "worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-alpine
    restart: always
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
