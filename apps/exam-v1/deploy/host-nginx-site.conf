# Host nginx site for the exam app behind Cloudflare. Install as
# /etc/nginx/sites-available/exam (see README "Behind a host reverse proxy").
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exam.stjosephsplacements.in;

    ssl_certificate /etc/ssl/certs/stjosephs.crt;
    ssl_certificate_key /etc/ssl/private/stjosephs.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare reaches this host through the local cloudflared tunnel; trust
    # its CF-Connecting-IP there only, so $remote_addr is the student.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
