stages:
  - deploy

deploy_production:
  stage: deploy
  image: bitnami/kubectl:latest
  only:
    - production
  script:
    - echo "Deploying commit ${CI_COMMIT_SHORT_SHA} to production..."
    - kubectl rollout restart deployment -n aethercode frontend gateway identity tenant user question-bank assessment submission judge seb notification analytics
    - echo "Waiting for rollouts to finish..."
    - kubectl rollout status deployment/frontend -n aethercode --timeout=180s || true
    - kubectl rollout status deployment/gateway -n aethercode --timeout=180s || true
    - echo "Deployment complete!"
