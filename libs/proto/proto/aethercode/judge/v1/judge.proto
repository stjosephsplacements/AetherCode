syntax = "proto3";

package aethercode.judge.v1;

option go_package = "github.com/aethercode/aethercode/libs/proto/gen/go/aethercode/judge/v1;judgev1";

service JudgeService {
  rpc SubmitExecution(SubmitExecutionRequest) returns (SubmitExecutionResponse);
  rpc PullCompletedExecutions(PullCompletedExecutionsRequest) returns (PullCompletedExecutionsResponse);
  rpc AcknowledgeCompletion(AcknowledgeCompletionRequest) returns (AcknowledgeCompletionResponse);
}

message ExecutionLimits {
  uint32 cpu_time_ms = 1;
  uint32 wall_time_ms = 2;
  uint64 memory_bytes = 3;
  uint32 process_limit = 4;
}

message SubmitExecutionRequest {
  string idempotency_key = 1;
  string tenant_fairness_key = 2;
  string submission_correlation_id = 3;
  string evaluation_bundle_ref = 4;
  string evaluation_bundle_sha256 = 5;
  string source_ciphertext_ref = 6;
  string language_key = 7;
  ExecutionLimits limits = 8;
  string source_ciphertext_sha256 = 9;
  string expires_at = 10;
  // An encrypted request metadata object. It may contain no platform foreign
  // keys or plaintext source/test payloads.
  string request_ciphertext_ref = 11;
}

message SubmitExecutionResponse {
  string job_id = 1;
  string status = 2;
}

message PullCompletedExecutionsRequest {
  string consumer_id = 1;
  uint32 limit = 2;
  uint32 lease_seconds = 3;
}

// CompletionVerdict is the normalized, terminal outcome vocabulary shared
// with Submission. Numeric values are append-only once published.
enum CompletionVerdict {
  COMPLETION_VERDICT_UNSPECIFIED = 0;
  COMPLETION_VERDICT_ACCEPTED = 1;
  COMPLETION_VERDICT_WRONG_ANSWER = 2;
  COMPLETION_VERDICT_TIME_LIMIT_EXCEEDED = 3;
  COMPLETION_VERDICT_MEMORY_LIMIT_EXCEEDED = 4;
  COMPLETION_VERDICT_RUNTIME_ERROR = 5;
  COMPLETION_VERDICT_COMPILE_ERROR = 6;
  COMPLETION_VERDICT_INTERNAL_ERROR = 7;
  COMPLETION_VERDICT_CANCELLED = 8;
}

message Completion {
  string event_id = 1;
  string job_id = 2;
  string submission_correlation_id = 3;
  string result_ref = 4;
  string result_sha256 = 5;
  // Deprecated: retained for wire compatibility. New consumers must require
  // this string to match verdict_code while using verdict_code as the
  // explicit normalized vocabulary.
  string verdict = 6 [deprecated = true];
  string delivery_id = 7;
  string lease_id = 8;
  string completed_at = 9;
  // result_ref, result_sha256, and result_encryption_key_reference are an
  // all-or-none encrypted object reference. The object is never transferred
  // over this API.
  string result_encryption_key_reference = 10;
  optional uint32 execution_time_ms = 11;
  optional uint32 memory_kib = 12;
  CompletionVerdict verdict_code = 13;
}

message PullCompletedExecutionsResponse {
  repeated Completion completions = 1;
}

message AcknowledgeCompletionRequest {
  string consumer_id = 1;
  string event_id = 2;
  string delivery_id = 3;
  string lease_id = 4;
}

message AcknowledgeCompletionResponse {}
